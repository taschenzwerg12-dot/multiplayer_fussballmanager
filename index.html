const CREST_SHAPES = {
  heater:'M10 6 H90 V50 Q90 80 50 97 Q10 80 10 50 Z',
  badge:'M20 5 H80 L93 18 V64 Q93 84 50 97 Q7 84 7 64 V18 Z',
  hex:'M50 3 L92 26 L92 74 L50 97 L8 74 L8 26 Z',
  pointed:'M50 3 L93 18 L86 66 L50 97 L14 66 L7 18 Z',
  kite:'M50 3 L90 22 L90 56 L50 97 L10 56 L10 22 Z',
  octa:'M30 4 H70 L95 29 V71 L70 96 H30 L5 71 V29 Z'
};
const CREST_PATS = ['solid','vstripes','halves','hoops','diag','chevron','quarters','cross','center'];
const CREST_FIX = {psg:['heater','center'],om:['octa','hoops'],asm:['kite','diag'],ol:['pointed','halves'],losc:['badge','chevron'],rcl:['heater','hoops'],srfc:['hex','halves'],ogcn:['badge','vstripes'],rcsa:['octa','chevron'],
  fcb:['badge','halves'],bvb:['heater','diag'],rma:['kite','chevron'],bar:['badge','quarters'],atm:['hex','cross'],int:['hex','vstripes'],mci:['octa','solid'],che:['kite','diag'],liv:['pointed','solid'],ars:['badge','center']};
function crestSpec(id){
  if(CREST_FIX[id]) return CREST_FIX[id];
  let h=0; for(const ch of id) h=(h*31+ch.charCodeAt(0))>>>0;
  const shapes=Object.keys(CREST_SHAPES);
  return [shapes[h%shapes.length], CREST_PATS[(h>>4)%CREST_PATS.length]];
}
let crestSeq=0;
function crestInner(id, withText){
  const t=T(id)||{c1:'#444',c2:'#888',tc:'#fff',short:'?'}, [shape,pat]=crestSpec(id), d=CREST_SHAPES[shape], cid='cr'+(++crestSeq);
  const c1=t.c1, c2=(t.c2.toLowerCase()===t.c1.toLowerCase())?t.tc:t.c2;
  const P={solid:'',
    vstripes:[10,34,58,82].map(x=>`<rect x="${x}" y="0" width="12" height="100" fill="${c2}"/>`).join(''),
    halves:`<rect x="50" y="0" width="50" height="100" fill="${c2}"/>`,
    hoops:[8,40,72].map(y=>`<rect x="0" y="${y}" width="100" height="14" fill="${c2}"/>`).join(''),
    diag:`<polygon points="0,18 18,0 100,82 82,100" fill="${c2}"/>`,
    chevron:`<polygon points="0,62 50,84 100,62 100,78 50,100 0,78" fill="${c2}"/><polygon points="0,6 50,28 100,6 100,18 50,40 0,18" fill="${c2}" opacity=".9"/>`,
    quarters:`<rect x="50" y="0" width="50" height="50" fill="${c2}"/><rect x="0" y="50" width="50" height="50" fill="${c2}"/>`,
    cross:`<rect x="42" y="0" width="16" height="100" fill="${c2}"/><rect x="0" y="66" width="100" height="12" fill="${c2}"/>`,
    center:`<rect x="36" y="0" width="28" height="100" fill="${c2}"/><rect x="33" y="0" width="3" height="100" fill="${t.tc}"/><rect x="64" y="0" width="3" height="100" fill="${t.tc}"/>`}[pat];
  const band = lum(c1)>.5 ? (lum(c2)<.5?c2:'#10151f') : '#0b0f18';
  const txt = esc(t.short), fs = txt.length<=3?20:txt.length===4?17:14;
  return `<defs><clipPath id="${cid}"><path d="${d}"/></clipPath></defs>
    <g clip-path="url(#${cid})"><rect width="100" height="100" fill="${c1}"/>${P}
      ${withText?`<rect x="0" y="39" width="100" height="24" fill="${band}" opacity=".88"/>`:''}</g>
    <path d="${d}" fill="none" stroke="${lum(c1)>.6?c2:'rgba(255,255,255,.85)'}" stroke-width="3.2" transform="translate(50 50) scale(.9) translate(-50 -50)"/>
    <path d="${d}" fill="none" stroke="rgba(0,0,0,.55)" stroke-width="1.6"/>
    ${withText?`<text x="50" y="${51+fs*.36}" text-anchor="middle" font-family="'Saira Condensed','Arial Narrow',sans-serif" font-weight="800" font-size="${fs}" fill="${inkOn(band)}" letter-spacing=".5">${txt}</text>`:''}`;
}

function planText(p){ const pl=S.train.plans[p.id]; if(!pl) return 'Kein Schwerpunkt';
  if(pl.t==='dev') return 'Talentförderung'; if(pl.t==='fit') return 'Fitness erhalten'; return `Lernt ${POS_NAME[pl.pos]} (${Math.round((pl.prog||0)*100)}%)` }

      ${a<=23?`<option value="dev" ${val==='dev'?'selected':''}>Talentförderung${bestPlan(p)==='dev'?' ★':''}</option>`:''}

    <section class="box">
      <div class="boxhead"><h2>Einzeltraining</h2><span class="label">${used} Spieler mit Schwerpunkt</span></div>
      <div class="quickpick"><div style="min-width:0"><b>Schnellauswahl</b><div class="muted small">Gibt jedem Spieler automatisch den besten Schwerpunkt: Talentförderung für junge Spieler mit Potenzial, Fitness für Spieler ab 29. Wer gerade eine Position lernt, behält das.</div></div>

      <tbody>${list.map(p=>`<tr><td class="l"><button class="nlink" data-pcard="${p.id}">${esc(p.full)}</button> <span class="muted posg">${p.pos}</span>${S.train.plans[p.id]&&S.train.plans[p.id].t==='pos'?`<div class="mbar pos"><i style="width:${Math.round((S.train.plans[p.id].prog||0)*100)}%"></i></div>`:''}</td>
        <td>${ageOf(p)}</td><td><b>${p.r}</b></td><td class="muted">${p.pot}</td><td class="l" style="min-width:90px">${trend(p)}</td><td class="l">${planSel(p)}</td></tr>`).join('')}</tbody></table></div>

      <div class="regions">${REGIONS.map(r=>`<button class="region" data-scout="${r.id}"><b>${r.name}</b><span class="muted small">${r.desc}</span><span class="cost num">${fmtM(r.cost)}</span></button>`).join('')}</div>

function finOver(){
  const L=S.fin.led[S.season]||{};
  const inc=Object.entries(L).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]), exp=Object.entries(L).filter(([,v])=>v<0).sort((a,b)=>a[1]-b[1]);

  const rows=(arr,cls)=>arr.map(([k,v])=>`<div class="frow"><span>${CATS[k]||k}</span><div class="fbar ${cls}"><i style="width:${Math.abs(v)/mx*100}%"></i></div><span class="num">${fmtM(v)}</span></div>`).join('')||'<p class="muted" style="margin:0">Noch nichts.</p>';
  const sal=S.players.slice().sort((a,b)=>salOf(b)-salOf(a)).slice(0,8);

  return `<div class="grid g2">
   <div class="grid">

      <div class="frow2"><span>Trikotverkauf</span><b class="up num">+${fmtM(S.kit.rate)}</b></div>

function stepPsgResult(st,idx){
  if(idx>=S.step) return null;
  if(st.t==='lig') return (S.results[st.md]||[]).find(r=>r.h===ME||r.a===ME)||null;
  const lab=stepLabel(st).replace(/^Champions Cup · /,'');
  return S.psgLog.find(r=>r.comp==='CL'&&r.label===lab)||null;
}
function dayEvents(){
  const map={};
  S.cal.forEach((st,idx)=>{ const d=dateOfStep(st); (map[d]=map[d]||[]).push({st,idx}) });
  return map;
}
function calView(){
  const first=seasonStart().slice(0,7), months=[];
  for(let i=0;i<11;i++){ const x=new Date(ms(first+'-01')); x.setUTCMonth(x.getUTCMonth()+i); months.push(iso(x.getTime()).slice(0,7)) }
  if(!calMonth||!months.includes(calMonth)) calMonth = months.includes(S.today.slice(0,7)) ? S.today.slice(0,7) : months[0];
  const mi=months.indexOf(calMonth), ev=dayEvents();
  const m0=calMonth+'-01', start=new Date(ms(m0)), lead=(start.getUTCDay()+6)%7;
  const daysIn=new Date(Date.UTC(start.getUTCFullYear(),start.getUTCMonth()+1,0)).getUTCDate();
  const cells=[]; for(let i=0;i<lead;i++) cells.push(null); for(let d=1;d<=daysIn;d++) cells.push(addDays(m0,d-1)); while(cells.length%7) cells.push(null);
  const chip=(e)=>{
    const {st,idx}=e, isCL=st.t==='cl', m=stepMatches(st).find(x=>x.includes(ME));
    const res=stepPsgResult(st,idx);
    if(res){ const o=outcome(res), op=T(res.h===ME?res.a:res.h); return `<span class="ev ${isCL?'cl':''} done ${o}">${res.hg}:${res.ag} ${esc(op.short)}</span>` }
    if(m){ const op=T(m[0]===ME?m[1]:m[0]); return `<span class="ev ${isCL?'cl':''}">${m[0]===ME?'':'@ '}${esc(op.short)}</span>` }
    if(isCL) return `<span class="ev cl ghost">CC</span>`;
    return '';
  };
  const sel=calSel&&calSel.slice(0,7)===calMonth?calSel:null;
  let panel='';
  if(calSel){
    const evs=(ev[calSel]||[]);
    const lines=evs.map(e=>{ const m=stepMatches(e.st).find(x=>x.includes(ME)); const res=stepPsgResult(e.st,e.idx);
      const lab=stepLabel(e.st);
      if(res) return `<div class="res"><span class="pill ${outcome(res)}">${OUT_TXT[outcome(res)]}</span><span>${esc(T(res.h).name)} – ${esc(T(res.a).name)} <span class="muted">· ${esc(lab)}</span></span><span class="score num">${res.hg}:${res.ag}</span></div>`;

      return `<div class="muted">${esc(lab)}${S.cl.psgIn&&!S.cl.psgOut?' (Gegner steht noch nicht fest)':''}</div>`; }).join('');
    const toSim=S.step<S.cal.length && calSel>S.today && dateOfStep(curStep())<calSel;
    const nPsg=toSim?S.cal.slice(S.step).filter(st=>dateOfStep(st)<calSel && (st.t==='lig'||psgPlays(st)||!S.cl.psgOut)).length:0;
    const isNext=S.step<S.cal.length && dateOfStep(curStep())===calSel && psgPlays(curStep());
    panel=`<section class="box">
      <div class="boxhead"><h2>${fmtLong(calSel)}</h2>${calSel===S.today?'<span class="comp">Heute</span>':''}</div>
      ${lines?`<div class="reslist">${lines}</div>`:'<p class="muted" style="margin:0">Kein Spiel an diesem Tag.</p>'}

        ${toSim?`<button class="btn main" data-act="simto">Bis hierhin simulieren</button><span class="muted small">Bis zu ${nPsg} Spiele von ${esc(CS())} werden simuliert. Spiele an diesem Tag bleiben offen.</span>`:''}
        ${isNext?`<button class="btn main" data-act="watch">Spiel ansehen (2D)</button><button class="btn" data-act="sim">Simulieren</button>`:''}
        ${!toSim&&!isNext&&calSel<S.today?'<span class="muted small">Dieser Tag liegt in der Vergangenheit.</span>':''}
      </div></section>`;
  }
  return `<div class="grid g2">
   <section class="box">
     <div class="boxhead"><h2>${MON[+calMonth.slice(5,7)-1]} ${calMonth.slice(0,4)}</h2>
       <div class="row"><button class="btn small" data-mon="-1" ${mi===0?'disabled':''} aria-label="Vorheriger Monat">‹</button><button class="btn small" data-mon="0">Heute</button><button class="btn small" data-mon="1" ${mi===months.length-1?'disabled':''} aria-label="Nächster Monat">›</button></div></div>
     <div class="cal">${WD.map(w=>`<div class="wd">${w}</div>`).join('')}
       ${cells.map(d=>{ if(!d) return '<div></div>'; const evs=ev[d]||[];
         const fill=evs.some(e=>e.st.t==='cl')?'dcl':evs.some(e=>e.st.t==='lig')?'dl1':'';
         return `<button class="day ${fill} ${d<S.today?'past':''} ${d===S.today?'today':''} ${d===sel?'sel':''}" data-day="${d}" aria-label="${fmtLong(d)}"><span class="dn">${+d.slice(8)}</span>${evs.map(chip).join('')}</button>` }).join('')}
     </div>
     <div class="legend"><span style="--c:#4a5368">${LNAME()}</span><span style="--c:#2448c4">Champions Cup</span><span style="--c:var(--flood)">Heute</span></div>
   </section>
   <div class="grid">
     ${panel||`<section class="box"><div class="boxhead"><h2>Tag auswählen</h2></div><p class="muted" style="margin:0">Tippe auf einen Tag im Kalender. Dann kannst du alle Spiele bis dahin auf einmal simulieren, zum Beispiel bis zum ersten Champions-Cup-Spieltag.</p></section>`}
     <section class="box"><div class="boxhead"><h2>Wichtige Termine</h2></div>
       <div class="reslist">${[['L1','Cup-Ligaphase startet'],['L8','Letzter Spieltag der Ligaphase'],['R16a','Achtelfinale'],['QFa','Viertelfinale'],['SFa','Halbfinale'],['F','Finale in Madrid']].map(([c,t])=>{const d=shiftSeason(CL_DATES[c]);return `<button class="nlink" data-jump="${d}">${fmtShort(d)} <span class="muted">· ${t}</span></button>`}).join('')}

     </section>
   </div>
  </div>`;

let drag=null, justDragged=false;
app.addEventListener('pointerdown',e=>{
  if(e.button>0) return;
  const slot=e.target.closest('.slot'), row=e.target.closest('tr[data-player]');
  if(!slot&&!row) return;
  const pid = slot ? S.lineup.xi[Number(slot.dataset.slot)] : row.dataset.player;
  drag={pid, fromSlot: slot?Number(slot.dataset.slot):null, x:e.clientX, y:e.clientY, on:false, ghost:null, over:null, id:e.pointerId};
});
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id) return;
  if(!drag.on){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<7) return;
    drag.on=true; const p=P(drag.pid);
    const g=document.createElement('div'); g.className='ghost'; g.innerHTML=`<span class="dot">${p.n}</span><span class="nm">${esc(p.name)}</span>`;
    document.body.appendChild(g); drag.ghost=g; document.body.classList.add('dragging');
  }
  e.preventDefault();
  drag.ghost.style.left=e.clientX+'px'; drag.ghost.style.top=e.clientY+'px';
  const el=document.elementFromPoint(e.clientX,e.clientY), t=el&&el.closest('.slot');
  if(drag.over&&drag.over!==t) drag.over.classList.remove('drop');
  if(t){ t.classList.add('drop'); drag.over=t } else drag.over=null;
},{passive:false});
function endDrag(e,cancel){
  if(!drag||(e&&e.pointerId!==drag.id)) return;
  const d=drag; drag=null;
  if(!d.on) return;
  d.ghost.remove(); document.body.classList.remove('dragging'); justDragged=true; setTimeout(()=>justDragged=false,350);
  if(cancel||!d.over) { render(); return }
  const to=Number(d.over.dataset.slot), xi=S.lineup.xi, cur=xi.indexOf(d.pid);
  if(cur>=0){ [xi[cur],xi[to]]=[xi[to],xi[cur]] } else xi[to]=d.pid;
  selSlot=null; save(); render();
}
window.addEventListener('pointerup',e=>endDrag(e,false));
window.addEventListener('pointercancel',e=>endDrag(e,true));

function openNeg(id){
  const p=marketPlayer(id); if(!p) return;

  startNeg(id); save(); negId=id;
  const ov=document.createElement('div'); ov.className='ov pc-ov'; ov.id='negov'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-label','Verhandlung');
  document.body.appendChild(ov); document.body.style.overflow='hidden';
  drawNeg();
  ov.addEventListener('click',e=>{
    const N=S.negs[negId], b=e.target.closest('button');
    if(e.target===ov||(b&&b.hasAttribute('data-close'))){ closeNeg(); return }
    if(!b) return;
    if(b.dataset.q){ const inp=ov.querySelector('#negamt'); inp.value=b.dataset.q; return }
    if(b.dataset.role){ N.role=b.dataset.role; drawNeg(); return }
    if(b.dataset.go==='club'){ const v=parseFloat(ov.querySelector('#negamt').value.replace(',','.')); if(!(v>0)) return;
      if(v>S.fin.bal && !S.admin){ ov.querySelector('#negerr').textContent=`So viel Geld hast du nicht. Kontostand: ${balTxt()}.`; return }
      offerClub(negId,v); save(); drawNeg(); return }
    if(b.dataset.go==='player'){ const v=parseFloat(ov.querySelector('#negamt').value.replace(',','.')); if(!(v>0)) return;
      const y=+ov.querySelector('#negyears').value, hd=parseFloat((ov.querySelector('#neghand').value||'0').replace(',','.'))||0; N.lastHand=hd;
      offerPlayer(negId,v,y,N.role||'stamm',hd); save(); drawNeg(); if(N.stage==='done' && (S.hwg||[]).length){ setTimeout(()=>{ closeNeg() },900) } return }
  });
}

function teamDots(side,id){
  const human=isMP()&&id===S.mp.other&&mpTeams[id]&&mpTeams[id].xi;
  const isP=id===ME, slots=isP?FORMATIONS[S.lineup.formation]:human?FORMATIONS[mpTeams[id].formation]:FORMATIONS['4-4-2'];
  const xi=isP?null:oppXI(id), base=strengthOf(id);

      num:pl?pl.n:OPP_NUM[i], pid:pl?pl.id:null, name:pl?pl.name:null, full:pl?pl.full:null,

const dirOf = side => side==='h'?1:-1;
function kickoff(side, hard){

  M.dots.forEach(d=>{ const kx=d.side==='h'?Math.min(d.bx*.6,.46):Math.max(1-(1-d.bx)*.6,.54); if(hard){ d.x=kx; d.y=d.by; d.vx=0; d.vy=0 } });
  const mine=M.dots.filter(d=>d.side===side&&d.role!=='TW').sort((a,b)=>Math.hypot(a.x-.5,a.y-.5)-Math.hypot(b.x-.5,b.y-.5))[0];

  M.holder=mine; M.poss=side; M.ball={x:.5,y:.5,z:0,fl:null}; M.timer=hard?.9:1.3; M.phase='play'; M.kick=mine;
}
function tick(text,min){ const t=M.ov.querySelector('#mtick'); const p=document.createElement('p'); p.innerHTML=`<b>${min}'</b>${esc(text)}`; t.prepend(p) }
function teamName(side){ return T(side==='h'?M.fx.h:M.fx.a).name }
function strengthSide(side){ return strengthOf(side==='h'?M.fx.h:M.fx.a) }
function sizeCanvas(){ if(!M) return; const w=M.cv.clientWidth, dpr=window.devicePixelRatio||1; const h=Math.round(w*72/109); M.cv.style.height=h+'px'; M.cv.width=Math.round(w*dpr); M.cv.height=Math.round(h*dpr); M.ctx.setTransform(dpr,0,0,dpr,0,0) }

function passTo(target,dur,kind){

function nearestOf(side,x,y,exclude){ let best=null,bd=9; M.dots.forEach(d=>{ if(d.side!==side||d===exclude) return; const dd=Math.hypot(d.x-x,d.y-y); if(dd<bd){bd=dd;best=d} }); return best }

function update(dt){

  if(M.phase==='cele'){ M.pause-=sdt; if(M.pause<=0){ kickoff(M.cele==='h'?'a':'h', false); M.cele=null } moveDots(sdt); return }

    const team=M.dots.filter(d=>d.side===nx.side);
    const sc = team.find(d=>d.pid&&(d.pid===nx.scorer||d.pid===nx.os)) || team.find(d=>d.role==='ST') || team[10];
    let ast = team.find(d=>d.pid&&(d.pid===nx.assist||d.pid===nx.oa)&&d!==sc);

function decide(h){

    const box=mates.filter(m=>(side==='h'?m.x:1-m.x)>.72 && Math.abs(m.y-.5)<.22);
    const t=box.length?wpick(box,box.map(m=>m.r)):mates.find(m=>m.role==='ST')||mates[0];

function shooter(d){ return d.name || `Nr. ${d.num} (${T(d.team).short})` }
function arrive(fl){

function moveDots(sdt){

    const dir=dirOf(d.side), ballF=d.side==='h'?bs.x:1-bs.x, baseF=d.side==='h'?d.bx:1-d.bx;

    else if(M.kick===d){ d.tx=d.side==='h'?.485:.515; d.ty=.5; sprint=1.2 }
    else if(d.role==='TW'){ const gx=d.side==='h'?.035:.965; d.tx=gx+dir*(ballF<.3?.03:0); d.ty=.5+(bs.y-.5)*.22 }
    else if(M.scripted && d===M.scripted.dot && d!==M.holder){ const lx=M.scripted.long?.68:.86; d.tx=d.side==='h'?lx:1-lx; d.ty=.5+(d.y-.5)*.35; sprint=1.3 }
    else if(d===M.holder && d.drib>0){ d.tx=Math.max(.04,Math.min(.96,d.x+dir*.12)); d.ty=d.y+(.5-d.y)*.35+Math.sin(M.gm*3+d.num)*.04; sprint=1.25 }
    else if(d===M.holder){ d.tx=Math.max(.04,Math.min(.96,d.x+dir*.08)); d.ty=d.y+(.5-d.y)*.15; sprint=.85 }
    else if(M.scripted && d===M.scripted.ast){ const ax=.72; d.tx=d.side==='h'?Math.max(d.x,ax):Math.min(d.x,1-ax); d.ty=d.by; sprint=1.15 }

function endMatch(){

  M.ov.querySelector('#mskip').hidden=true; M.ov.querySelector('#mdone').hidden=false;
  const others=M.results.filter(r=>r!==M.fx);
  M.ov.querySelector('#mothers').innerHTML=`<div class="label" style="margin-top:16px">Die anderen Spiele</div><div class="others num">${others.map(r=>`<span>${esc(T(r.h).name)} <b>${r.hg}:${r.ag}</b> ${esc(T(r.a).name)}</span>`).join('')}</div>`;
}
function finishNow(){
  if(!M||M.phase==='end') return;
  while(M.events.length){ const ev=M.events.shift(); M.score[ev.side==='h'?0:1]++; tick(`TOR für ${teamName(ev.side)}!${scorerName(ev)?` Torschütze: ${scorerName(ev)}.`:''}`, ev.min) }
  M.scripted=null; M.gm=90; M.cele=null; endMatch();
}
function closeMatch(){
  const rs=M.results; applyStep(rs); window.removeEventListener('resize',sizeCanvas);
  M.ov.remove(); document.body.style.overflow=''; M=null; render();
  if(isMP()) setTimeout(mpApply,50);
  if((S.psgLog[S.psgLog.length-1]||{}).note) flashResult(rs);
}
function loop(now){
  if(!M) return;
  const dt=Math.min(.05,(now-M.last)/1000); M.last=now;
  // Feste kleine Rechenschritte: auch bei 4× bleibt die Bewegung flüssig
  const n=Math.max(1,Math.ceil(dt*M.speed/.008));
  for(let i=0;i<n&&M;i++) update(dt/n);
  if(!M) return;
  draw();
  const sc=`${M.score[0]}:${M.score[1]}`, mn=M.phase==='end'?'Abpfiff':`${Math.min(90,Math.floor(M.gm)+1)}'`;
  if(sc!==M.lastSc){ M.ov.querySelector('#msc').textContent=sc; M.lastSc=sc }
  if(mn!==M.lastMn){ M.ov.querySelector('#mmin').textContent=mn; M.lastMn=mn }
  requestAnimationFrame(loop);
}
function drawPitch(W,H){
  // Rasen und Linien werden nur einmal gezeichnet und dann wiederverwendet
  const dpr=window.devicePixelRatio||1, key=W+'x'+H+'x'+dpr;
  if(M.pitchKey===key) return M.pitch;
  const c=document.createElement('canvas'); c.width=Math.round(W*dpr); c.height=Math.round(H*dpr);
  const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  const pad=Math.max(14,W*.03), pw=W-2*pad, ph=H-2*pad, sx=pw/105, sy=ph/68, X=x=>pad+x*pw, Y=y=>pad+y*ph;
  for(let i=0;i<14;i++){ ctx.fillStyle=i%2?'#2a7243':'#2f7c49'; ctx.fillRect(i*W/14,0,W/14+1,H) }
  const g=ctx.createRadialGradient(W/2,H/2,H*.2,W/2,H/2,W*.75); g.addColorStop(0,'rgba(255,255,255,.05)'); g.addColorStop(1,'rgba(0,0,0,.28)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.78)'; ctx.lineWidth=Math.max(1.5,W/500);
  ctx.strokeRect(pad,pad,pw,ph);
  ctx.beginPath(); ctx.moveTo(X(.5),pad); ctx.lineTo(X(.5),pad+ph); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(X(.5),Y(.5),9.15*sx,9.15*sy,0,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(X(.5),Y(.5),2,0,Math.PI*2); ctx.fill();
  [[0,1],[1,-1]].forEach(([gx,d])=>{
    const x0=X(gx);
    ctx.strokeRect(Math.min(x0,x0+d*16.5*sx),Y(.5)-20.15*sy,16.5*sx,40.3*sy);
    ctx.strokeRect(Math.min(x0,x0+d*5.5*sx),Y(.5)-9.15*sy,5.5*sx,18.3*sy);
    ctx.fillStyle='rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(x0+d*11*sx,Y(.5),2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x0+d*11*sx,Y(.5),9.15*sx,9.15*sy,0,d>0?-0.93:Math.PI-0.93,d>0?0.93:Math.PI+0.93); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.25)'; ctx.fillRect(Math.min(x0,x0-d*2.2*sx),Y(.5)-3.66*sy,2.2*sx,7.32*sy);
    ctx.strokeRect(Math.min(x0,x0-d*2.2*sx),Y(.5)-3.66*sy,2.2*sx,7.32*sy);
  });
  M.pitch=c; M.pitchKey=key; return c;
}
function draw(){
  const ctx=M.ctx, W=M.cv.clientWidth, H=M.cv.clientHeight, pad=Math.max(14,W*.03);
  const pw=W-2*pad, ph=H-2*pad;
  const X=x=>pad+x*pw, Y=y=>pad+y*ph;
  ctx.drawImage(drawPitch(W,H),0,0,W,H);
  const r=Math.max(8,W/68);
  // Ballspur
  M.trail=M.trail||[]; M.trail.push([M.ball.x,M.ball.y,M.ball.z||0]); if(M.trail.length>9) M.trail.shift();
  ctx.font=`800 ${Math.round(r*1.05)}px 'Saira Condensed','Arial Narrow',sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  const sorted=M.dots.slice().sort((a,b)=>a.y-b.y);
  sorted.forEach(d=>{ ctx.fillStyle='rgba(0,0,0,.26)'; ctx.beginPath(); ctx.ellipse(X(d.x)+2,Y(d.y)+3.5,r*1.02,r*.78,0,0,Math.PI*2); ctx.fill() });
  sorted.forEach(d=>{
    const t=T(d.team);
    const K=d.team===ME?{c1:S.kit.c1,c2:S.kit.c2,tc:S.kit.c3===S.kit.c1?'#888':S.kit.c3}:t;
    const gkH=d.team===ME?'#2e2e2e':'#f2c94c';
    const px=X(d.x), py=Y(d.y);
    if(d===M.holder){ ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(px,py,r+4,0,Math.PI*2); ctx.stroke() }
    ctx.fillStyle=d.role==='TW'?gkH:K.c1; ctx.strokeStyle=K.c2; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle=d.role==='TW'?(gkH==='#2e2e2e'?'#fff':'#1a1405'):K.tc; ctx.fillText(d.num,px,py+1);
  });
  const br=Math.max(4,r*.45);
  M.trail.forEach(([x,y,z],i)=>{ if(i===M.trail.length-1) return; const a=(i+1)/M.trail.length*.22; ctx.fillStyle=`rgba(255,255,255,${a})`; ctx.beginPath(); ctx.arc(X(x),Y(y)-z*ph,br*(.4+.5*i/M.trail.length),0,Math.PI*2); ctx.fill() });
  const z=(M.ball.z||0)*ph, bs=br*(1+(M.ball.z||0)*5);
  ctx.fillStyle='rgba(0,0,0,.32)'; ctx.beginPath(); ctx.ellipse(X(M.ball.x)+2,Y(M.ball.y)+2,br,br*.75,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.strokeStyle='#111'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(X(M.ball.x),Y(M.ball.y)-z,bs,0,Math.PI*2); ctx.fill(); ctx.stroke();
  // TOR-Einblendung mit weichem Ein- und Ausblenden
  const target=M.phase==='cele'?1:0; M.celeA=(M.celeA||0)+(target-(M.celeA||0))*.15;
  if(M.celeA>.01){
    const a=M.celeA, sc=.85+.15*a;
    ctx.save(); ctx.globalAlpha=a;
    ctx.fillStyle='rgba(5,8,15,.58)'; ctx.fillRect(0,H/2-H*.16,W,H*.32);
    ctx.translate(W/2,H/2); ctx.scale(sc,sc);
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--flood').trim()||'#f3c94b';
    ctx.font=`800 ${Math.round(H*.16)}px 'Saira Condensed','Arial Narrow',sans-serif`; ctx.fillText('TOR!',0,-H*.03);
    ctx.fillStyle='#fff'; ctx.font=`700 ${Math.round(H*.055)}px 'Barlow',system-ui,sans-serif`; ctx.fillText(M.celeText||'',0,H*.09);
    ctx.restore();
  }
}

/* ===================== START ===================== */
load(); render(); if(isMP()) mpConnect();
</script>
