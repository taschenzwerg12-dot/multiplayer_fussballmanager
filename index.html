function sizeCanvas(){ if(!M) return; const w=M.cv.clientWidth, dpr=window.devicePixelRatio||1; const h=Math.round(w*72/109); M.cv.style.height=h+'px'; M.cv.width=Math.round(w*dpr); M.cv.height=Math.round(h*dpr); M.ctx.setTransform(dpr,0,0,dpr,0,0) }

function passTo(target,dur,kind){
  // Ball fliegt zu einem festen Punkt. Der Empfänger läuft diesem Punkt entgegen, statt dass der Ball ihm hinterherjagt.
  let tx=target.x, ty=target.y;
  if(target.side && (kind==='pass'||kind==='steal')){ const lead=dur*.35; tx+= (target.vx||0)*lead; ty+=(target.vy||0)*lead; tx=Math.max(.02,Math.min(.98,tx)); ty=Math.max(.03,Math.min(.97,ty)) }
  const side=M.holder?M.holder.side:M.poss, passer=M.holder;
  // Abfangen: steht ein Gegner nah an der Passlinie, kann er dazwischengehen
  if((kind==='pass'||kind==='cross') && passer && !(M.scripted&&passer.side===M.scripted.side)){
    const ax=M.ball.x, ay=M.ball.y, L=Math.hypot(tx-ax,ty-ay)||1e-6;
    let best=null, bd=.03;
    M.dots.forEach(o=>{ if(o.side===side) return; const t=Math.max(0,Math.min(1,((o.x-ax)*(tx-ax)+(o.y-ay)*(ty-ay))/(L*L))); if(t<.15) return;
      const dd=Math.hypot(ax+(tx-ax)*t-o.x, ay+(ty-ay)*t-o.y); if(dd<bd){ bd=dd; best=o } });
    if(best && Math.random()<.45*Math.pow(best.r/passer.r,2)){ target=best; tx=best.x; ty=best.y; kind='steal'; M.poss=best.side }
  }
  const dist=Math.hypot(tx-M.ball.x,ty-M.ball.y);
  const speed = kind==='shot'||kind==='miss'||kind==='save'||kind==='block' ? 1.9 : kind==='cross' ? .95 : 1.05;
  M.ball.fl={fx:M.ball.x,fy:M.ball.y,tx,ty,t:0,dur:Math.max(.2,dist/speed+.08),kind,target,side,
    arc: kind==='cross' ? Math.min(.09,dist*.2) : kind==='pass'&&dist>.3 ? Math.min(.06,dist*.12) : kind==='miss' ? .03 : 0};
  if(target.side) target.recv=true;
  M.holder=null;
}
function nearestOf(side,x,y,exclude){ let best=null,bd=9; M.dots.forEach(d=>{ if(d.side!==side||d===exclude) return; const dd=Math.hypot(d.x-x,d.y-y); if(dd<bd){bd=dd;best=d} }); return best }

function update(dt){
  const sdt=dt*M.speed;
  if(M.phase==='end'){ moveDots(sdt); return }
  if(M.phase==='cele'){ M.pause-=sdt; if(M.pause<=0){ kickoff(M.cele==='h'?'a':'h', false); M.cele=null } moveDots(sdt); return }
  M.gm+=sdt*1.5;
  if(!M.half && M.gm>=45 && !M.scripted && M.phase==='play' && !M.ball.fl){ M.half=true; tick('Halbzeit. Weiter geht’s mit Durchgang zwei.',45); kickoff('a', true) }
  // geplantes Tor vorbereiten
  const nx=M.events[0];
  if(nx && !M.scripted && M.gm>=nx.min-3 && M.phase==='play' && !M.ball.fl){
    const team=M.dots.filter(d=>d.side===nx.side);
    const sc = team.find(d=>d.pid&&(d.pid===nx.scorer||d.pid===nx.os)) || team.find(d=>d.role==='ST') || team[10];
    let ast = team.find(d=>d.pid&&(d.pid===nx.assist||d.pid===nx.oa)&&d!==sc);
    if(!ast){ const c=team.filter(d=>d!==sc&&d.role!=='TW'); ast=wpick(c,c.map(d=>AST_W[d.role]*Math.pow(d.r/80,5))) }
    M.scripted={...nx, dot:sc, ast, long: sc.r>=84 && Math.random()<.22, solo: sc.r>=86 && Math.random()<.35};
    if(M.holder && M.holder.side!==nx.side){ const t=nearestOf(nx.side,M.ball.x,M.ball.y); if(M.holder.drib) M.holder.drib=0; M.holder=t; M.timer=.4; if(Math.random()<.5) tick(`Balleroberung durch ${shooter(t)}!`, Math.floor(M.gm)+1) }
    M.poss=nx.side;
  }
  // Ball im Flug
  const fl=M.ball.fl;
  if(fl){
    fl.t+=sdt; const k=Math.min(1,fl.t/fl.dur);
    const e = fl.kind==='shot'||fl.kind==='miss' ? k*(2-k) : k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;  // weiches Beschleunigen und Abbremsen
    M.ball.x=fl.fx+(fl.tx-fl.fx)*e; M.ball.y=fl.fy+(fl.ty-fl.fy)*e; M.ball.z=fl.arc*4*k*(1-k);
    if(k>=1){ M.ball.fl=null; M.ball.z=0; if(fl.target&&fl.target.side) fl.target.recv=false; arrive(fl) }
  } else if(M.holder){
    const h=M.holder, d=dirOf(h.side);
    // Ball klebt nicht starr am Fuß, sondern folgt weich
    const bx=h.x+d*.011+(h.vx||0)*.06, by=h.y+(h.vy||0)*.06, f=Math.min(1,sdt*14);
    if(!(M.kick && Math.hypot(h.x-.5,h.y-.5)>.03)){ M.ball.x+=(bx-M.ball.x)*f; M.ball.y+=(by-M.ball.y)*f } M.ball.z=0;
    const near=Math.hypot(M.ball.x-bx,M.ball.y-by)<.02;
    M.timer-=sdt; if(h.drib>0) h.drib-=sdt;
    const SC=M.scripted;
    if(M.kick){ if(M.timer<=0&&near){ M.kick=null; decide(h) } }
    else if(SC && h===SC.dot){
      const ownX=h.side==='h'?h.x:1-h.x, ready=SC.long?ownX>.62:ownX>.8;
      if(near && ((M.gm>=SC.min && ready) || M.gm>=SC.min+1.5)){ M.phase='shot'; passTo({x:d>0?1.0:0.0,y:.5+rnd(-.035,.035)}, 0,'shot');
        if(SC.long) tick(`${shooter(h)} zieht aus der Distanz ab...`, Math.floor(M.gm)+1); else if(SC.solo) tick(`${shooter(h)} tanzt seinen Gegenspieler aus...`, Math.floor(M.gm)+1) }
      else if(SC.solo && !h.drib) h.drib=1;
    } else if(SC && h===SC.ast){
      const sc=SC.dot, scX=sc.side==='h'?sc.x:1-sc.x;
      if(near && M.timer<=0 && (scX>.7 || M.gm>=SC.min-.4)){ const wing=['LF','RF','LV','RV'].includes(h.role)&&Math.abs(h.y-.5)>.2; passTo(sc,0,wing?'cross':'pass') }
    } else if(SC){
      if(M.timer<=0&&near) passTo(SC.ast||SC.dot, 0,'pass');
    } else if(M.timer<=0&&near) decide(h);
    // Zweikampf: ein Verteidiger nah am Ballführer kann den Ball erobern. Stärke entscheidet.
    if(M.holder===h && !M.kick && h.role!=='TW' && !(SC && h.side===SC.side)){
      const opp=h.side==='h'?'a':'h', pr=nearestOf(opp,h.x,h.y);
      if(pr && Math.hypot(pr.x-h.x,pr.y-h.y)<.026){
        const rate=1.1*Math.pow(pr.r/h.r,4)*(h.drib>0?.75:1);
        if(Math.random()<rate*sdt){ h.drib=0; M.holder=pr; M.poss=opp; M.timer=rnd(.35,.7); if(Math.random()<.15) tick(`Starker Zweikampf von ${shooter(pr)}!`, Math.floor(M.gm)+1) }
      }
    }
  }
  if(M.gm>=90 && !M.scripted && !M.events.length && M.phase==='play' && !M.ball.fl){ M.gm=90; endMatch(); }
  if(M.gm>=94 && M.events.length){ finishNow(); }
  moveDots(sdt);
}
function decide(h){
  const side=h.side, opp=side==='h'?'a':'h', d=dirOf(side);
  const ownX = side==='h'?h.x:1-h.x, mates=M.dots.filter(x=>x.side===side&&x!==h), opps=M.dots.filter(x=>x.side===opp);
  const nearOpp=Math.min(...opps.map(o=>Math.hypot(o.x-h.x,o.y-h.y))), pressed=nearOpp<.06, min=Math.floor(M.gm)+1;
  const goalY=.5, gx=d>0?1:0;
  // Torwart: kurz aufbauen oder lang schlagen
  if(h.role==='TW'){
    const def=mates.filter(m=>['IV','LV','RV','ZDM'].includes(m.role));
    const t=Math.random()<.78&&def.length?wpick(def,def.map(m=>1/(.1+Math.hypot(m.x-h.x,m.y-h.y)))):wpick(mates,mates.map(m=>m.role==='ST'||m.role==='LF'||m.role==='RF'?1:.1));
    return passTo(t,0,'pass');
  }
  // Abschluss (ohne Tor; Tore stehen vorher fest)
  const shootP = ownX>.8 ? .2+(h.r-75)*.014 : ownX>.64 && h.r>=82 ? .07 : 0;
  if(shootP>0 && Math.random()<shootP){
    M.phase='shot'; const gk=opps.find(o=>o.role==='TW'); const roll=Math.random();
    if(roll<.48){ passTo({x:gx,y:goalY+rnd(-.05,.05)},0,'save'); M.ball.fl.keeper=gk; if(Math.random()<.6) tick(pick([`Schuss von ${shooter(h)}, aber ${shooter(gk)} pariert!`,`Starke Parade von ${shooter(gk)} gegen ${shooter(h)}!`,`${shooter(h)} prüft den Torwart, ${shooter(gk)} hält.`]),min) }
    else if(roll<.75){ passTo({x:gx,y:goalY+(Math.random()<.5?-1:1)*rnd(.07,.18)},0,'miss'); if(Math.random()<.45) tick(pick([`${shooter(h)} zieht ab, knapp vorbei!`,`${shooter(h)} schießt drüber.`,`Chance für ${teamName(side)}, aber daneben.`]),min) }
    else { const bl=nearestOf(opp,h.x+d*.05,h.y); passTo({x:h.x+d*.03,y:h.y+rnd(-.02,.02)},0,'block'); M.ball.fl.blocker=bl; if(Math.random()<.35) tick(`Schuss von ${shooter(h)} wird geblockt.`,min) }
    return;
  }
  // Flanke von außen
  if(['LF','RF','LV','RV'].includes(h.role) && ownX>.72 && Math.abs(h.y-.5)>.2 && Math.random()<.5){
    const box=mates.filter(m=>(side==='h'?m.x:1-m.x)>.72 && Math.abs(m.y-.5)<.22);
    const t=box.length?wpick(box,box.map(m=>m.r)):mates.find(m=>m.role==='ST')||mates[0];
    if(Math.random()<.25) tick(`Flanke von ${shooter(h)}...`,min);
    return passTo(t,0,'cross');
  }
  // Dribbling: gute Offensivspieler mit etwas Platz
  if(['LF','RF','ST','OM'].includes(h.role) && ownX>.4 && !h.drib && Math.random()<Math.max(0,(h.r-72)/45)){
    h.drib=rnd(.6,1.3); M.timer=h.drib;
    if(h.r>=86 && Math.random()<.3) tick(pick([`${shooter(h)} geht ins Dribbling!`,`${shooter(h)} lässt zwei Gegner stehen!`,`Tempo-Dribbling von ${shooter(h)}!`]),min);
    return;
  }
  // Pass: freie Mitspieler bevorzugt, nicht nur steil nach vorne
  const open=m=>Math.min(...opps.map(o=>Math.hypot(o.x-m.x,o.y-m.y)));
  const w=mates.map(m=>{ const gain=(m.x-h.x)*d, dist=Math.hypot(m.x-h.x,m.y-h.y);
    let v=Math.exp(gain*1.8)*(Math.min(.12,open(m))/.12+.15)/(.15+dist)*Math.pow(m.r/80,2);
    if(m.role==='TW') v*= ownX<.35&&pressed ? .5 : .03;
    if(dist>.45) v*=.25;
    if(gain<0 && ownX>.55) v*=.6;
    return v });
  const t=wpick(mates,w);
  passTo(t,0,'pass');
}
function shooter(d){ return d.name || `Nr. ${d.num} (${T(d.team).short})` }
function arrive(fl){
  const SC=M.scripted;
  if(fl.kind==='pass'||fl.kind==='steal'||fl.kind==='cross'){
    let t=fl.target;
    if(SC && t.side!==SC.side){ t=nearestOf(SC.side,M.ball.x,M.ball.y) }   // Tor steht bevor: der richtige Verein bekommt den Ball
    M.holder=t; M.poss=t.side; M.timer=fl.kind==='cross'?.12:rnd(.5,1.2)*(1+(t.r-75)/60); M.phase='play'; return }
  if(fl.kind==='save'||fl.kind==='miss'){ const opp=fl.side==='h'?'a':'h'; const gk=fl.keeper||M.dots.find(d=>d.side===opp&&d.role==='TW'); M.holder=gk; M.poss=opp; M.timer=1.1; M.phase='play'; return }
  if(fl.kind==='block'){ const opp=fl.side==='h'?'a':'h'; const b=fl.blocker||nearestOf(opp,M.ball.x,M.ball.y); M.holder=b; M.poss=opp; M.timer=.6; M.phase='play'; return }
  if(fl.kind==='shot'){
    const ev=M.scripted, side=ev.side; M.score[side==='h'?0:1]++;
    const who=scorerName(ev), ast=assistName(ev);
    tick(`TOR für ${teamName(side)}!${who?` Torschütze: ${who}${ast?`, Vorlage: ${ast}`:''}.`:''} Neuer Stand ${M.score[0]}:${M.score[1]}.`, ev.min);
    M.events.shift(); M.scripted=null; M.phase='cele'; M.cele=side; M.pause=2.2; M.celeText=who||teamName(side);
  }
}
function moveDots(sdt){
  // Weiche Laufbewegung: jeder Spieler hat eine Geschwindigkeit, beschleunigt und bremst sanft ab.
  const b=M.ball;
  M.bs=M.bs||{x:b.x,y:b.y}; const sf=Math.min(1,sdt*3); M.bs.x+=(b.x-M.bs.x)*sf; M.bs.y+=(b.y-M.bs.y)*sf;  // geglätteter Ballpunkt für die Mannschaftsform
  const bs=M.bs, fl=b.fl, aim=fl?{x:fl.tx,y:fl.ty}:b;
  const holderSide=M.holder&&M.holder.side;
  const presserH = M.phase==='play' ? nearestOf('h',aim.x,aim.y,holderSide==='h'?M.holder:null) : null;
  const presserA = M.phase==='play' ? nearestOf('a',aim.x,aim.y,holderSide==='a'?M.holder:null) : null;
  M.dots.forEach(d=>{
    const dir=dirOf(d.side), ballF=d.side==='h'?bs.x:1-bs.x, baseF=d.side==='h'?d.bx:1-d.bx;
    const hasPoss=M.poss===d.side; let sprint=1;
    if(M.phase==='cele'||M.phase==='end'){ d.tx = d.side==='h'?Math.min(d.bx*.6,.46):Math.max(1-(1-d.bx)*.6,.54); d.ty=d.by; if(M.phase==='cele'&&M.kick===d){ d.tx=d.side==='h'?.485:.515; d.ty=.5 } }
    else if(d.recv && fl){ d.tx=fl.tx; d.ty=fl.ty; sprint=1.25 }
    else if(M.kick===d){ d.tx=d.side==='h'?.485:.515; d.ty=.5; sprint=1.2 }
    else if(d.role==='TW'){ const gx=d.side==='h'?.035:.965; d.tx=gx+dir*(ballF<.3?.03:0); d.ty=.5+(bs.y-.5)*.22 }
    else if(M.scripted && d===M.scripted.dot && d!==M.holder){ const lx=M.scripted.long?.68:.86; d.tx=d.side==='h'?lx:1-lx; d.ty=.5+(d.y-.5)*.35; sprint=1.3 }
    else if(d===M.holder && d.drib>0){ d.tx=Math.max(.04,Math.min(.96,d.x+dir*.12)); d.ty=d.y+(.5-d.y)*.35+Math.sin(M.gm*3+d.num)*.04; sprint=1.25 }
    else if(d===M.holder){ d.tx=Math.max(.04,Math.min(.96,d.x+dir*.08)); d.ty=d.y+(.5-d.y)*.15; sprint=.85 }
    else if(M.scripted && d===M.scripted.ast){ const ax=.72; d.tx=d.side==='h'?Math.max(d.x,ax):Math.min(d.x,1-ax); d.ty=d.by; sprint=1.15 }
    else if(!hasPoss && (d===presserH||d===presserA)){ d.tx=aim.x-dir*.015; d.ty=aim.y; sprint=1.15 }
    else {
      let fx=baseF+(ballF-.45)*.45+(hasPoss?.07:-.04);
      fx=Math.max(.08,Math.min(.95,fx));
      // kleine eigene Laufwege, damit die Formation lebendig wirkt
      d.ph=(d.ph||Math.random()*6.28)+sdt*.7;
      d.tx=(d.side==='h'?fx:1-fx)+Math.sin(d.ph)*.012; d.ty=Math.max(.05,Math.min(.95,d.by+(bs.y-.5)*.3+Math.cos(d.ph*1.3)*.015));
    }
    // Abstand halten, damit sich Spieler nicht übereinander stapeln
    if(d!==M.holder && !d.recv) M.dots.forEach(o=>{ if(o===d) return; const ox=d.x-o.x, oy=d.y-o.y, od=Math.hypot(ox,oy); if(od>0&&od<.04){ const push=(.04-od)*.8; d.tx+=ox/od*push; d.ty+=oy/od*push } });
    const vmax=.2*sprint, dx=d.tx-d.x, dy=d.ty-d.y, dist=Math.hypot(dx,dy);
    const want=Math.min(vmax, dist*3.2);                     // je näher am Ziel, desto langsamer (sanftes Ankommen)
    const wx=dist>1e-4?dx/dist*want:0, wy=dist>1e-4?dy/dist*want:0;
    const acc=Math.min(1,sdt*6);                             // weiches Beschleunigen
    d.vx=(d.vx||0)+(wx-(d.vx||0))*acc; d.vy=(d.vy||0)+(wy-(d.vy||0))*acc;

  });
}
function endMatch(){
  M.phase='end'; tick(`Abpfiff! Endstand ${M.score[0]}:${M.score[1]}.`,90);
  M.ov.querySelector('#mskip').hidden=true; M.ov.querySelector('#mdone').hidden=false;
  const others=M.results.filter(r=>r!==M.fx);
  M.ov.querySelector('#mothers').innerHTML=`<div class="label" style="margin-top:16px">Die anderen Spiele</div><div class="others num">${others.map(r=>`<span>${esc(T(r.h).name)} <b>${r.hg}:${r.ag}</b> ${esc(T(r.a).name)}</span>`).join('')}</div>`;
}
function finishNow(){
  if(!M||M.phase==='end') return;
  while(M.events.length){ const ev=M.events.shift(); M.score[ev.side==='h'?0:1]++; tick(`TOR für ${teamName(ev.side)}!${scorerName(ev)?` Torschütze: ${scorerName(ev)}.`:''}`, ev.min) }
  M.scripted=null; M.gm=90; M.cele=null; endMatch();
}
function closeMatch(){
  const rs=M.results; applyStep(rs); window.removeEventListener('resize',sizeCanvas);
  M.ov.remove(); document.body.style.overflow=''; M=null; render();
  if(isMP()) setTimeout(mpApply,50);
  if((S.psgLog[S.psgLog.length-1]||{}).note) flashResult(rs);
}
function loop(now){
  if(!M) return;
  const dt=Math.min(.05,(now-M.last)/1000); M.last=now;
  // Feste kleine Rechenschritte: auch bei 4× bleibt die Bewegung flüssig
  const n=Math.max(1,Math.ceil(dt*M.speed/.008));
  for(let i=0;i<n&&M;i++) update(dt/n);
  if(!M) return;
  draw();
  const sc=`${M.score[0]}:${M.score[1]}`, mn=M.phase==='end'?'Abpfiff':`${Math.min(90,Math.floor(M.gm)+1)}'`;
  if(sc!==M.lastSc){ M.ov.querySelector('#msc').textContent=sc; M.lastSc=sc }
  if(mn!==M.lastMn){ M.ov.querySelector('#mmin').textContent=mn; M.lastMn=mn }
  requestAnimationFrame(loop);
}
function drawPitch(W,H){
  // Rasen und Linien werden nur einmal gezeichnet und dann wiederverwendet
  const dpr=window.devicePixelRatio||1, key=W+'x'+H+'x'+dpr;
  if(M.pitchKey===key) return M.pitch;
  const c=document.createElement('canvas'); c.width=Math.round(W*dpr); c.height=Math.round(H*dpr);
  const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  const pad=Math.max(14,W*.03), pw=W-2*pad, ph=H-2*pad, sx=pw/105, sy=ph/68, X=x=>pad+x*pw, Y=y=>pad+y*ph;
  for(let i=0;i<14;i++){ ctx.fillStyle=i%2?'#2a7243':'#2f7c49'; ctx.fillRect(i*W/14,0,W/14+1,H) }
  const g=ctx.createRadialGradient(W/2,H/2,H*.2,W/2,H/2,W*.75); g.addColorStop(0,'rgba(255,255,255,.05)'); g.addColorStop(1,'rgba(0,0,0,.28)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.78)'; ctx.lineWidth=Math.max(1.5,W/500);
  ctx.strokeRect(pad,pad,pw,ph);
  ctx.beginPath(); ctx.moveTo(X(.5),pad); ctx.lineTo(X(.5),pad+ph); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(X(.5),Y(.5),9.15*sx,9.15*sy,0,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(X(.5),Y(.5),2,0,Math.PI*2); ctx.fill();
  [[0,1],[1,-1]].forEach(([gx,d])=>{
    const x0=X(gx);
    ctx.strokeRect(Math.min(x0,x0+d*16.5*sx),Y(.5)-20.15*sy,16.5*sx,40.3*sy);
    ctx.strokeRect(Math.min(x0,x0+d*5.5*sx),Y(.5)-9.15*sy,5.5*sx,18.3*sy);
    ctx.fillStyle='rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(x0+d*11*sx,Y(.5),2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x0+d*11*sx,Y(.5),9.15*sx,9.15*sy,0,d>0?-0.93:Math.PI-0.93,d>0?0.93:Math.PI+0.93); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.25)'; ctx.fillRect(Math.min(x0,x0-d*2.2*sx),Y(.5)-3.66*sy,2.2*sx,7.32*sy);
    ctx.strokeRect(Math.min(x0,x0-d*2.2*sx),Y(.5)-3.66*sy,2.2*sx,7.32*sy);
  });
  M.pitch=c; M.pitchKey=key; return c;
}
function draw(){
  const ctx=M.ctx, W=M.cv.clientWidth, H=M.cv.clientHeight, pad=Math.max(14,W*.03);
  const pw=W-2*pad, ph=H-2*pad;
  const X=x=>pad+x*pw, Y=y=>pad+y*ph;
  ctx.drawImage(drawPitch(W,H),0,0,W,H);
  const r=Math.max(8,W/68);
  // Ballspur
  M.trail=M.trail||[]; M.trail.push([M.ball.x,M.ball.y,M.ball.z||0]); if(M.trail.length>9) M.trail.shift();
  ctx.font=`800 ${Math.round(r*1.05)}px 'Saira Condensed','Arial Narrow',sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  const sorted=M.dots.slice().sort((a,b)=>a.y-b.y);
  sorted.forEach(d=>{ ctx.fillStyle='rgba(0,0,0,.26)'; ctx.beginPath(); ctx.ellipse(X(d.x)+2,Y(d.y)+3.5,r*1.02,r*.78,0,0,Math.PI*2); ctx.fill() });
  sorted.forEach(d=>{
    const t=T(d.team);
    const K=d.team===ME?{c1:S.kit.c1,c2:S.kit.c2,tc:S.kit.c3===S.kit.c1?'#888':S.kit.c3}:t;
    const gkH=d.team===ME?'#2e2e2e':'#f2c94c';
    const px=X(d.x), py=Y(d.y);
    if(d===M.holder){ ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(px,py,r+4,0,Math.PI*2); ctx.stroke() }
    ctx.fillStyle=d.role==='TW'?gkH:K.c1; ctx.strokeStyle=K.c2; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle=d.role==='TW'?(gkH==='#2e2e2e'?'#fff':'#1a1405'):K.tc; ctx.fillText(d.num,px,py+1);
  });
  const br=Math.max(4,r*.45);
  M.trail.forEach(([x,y,z],i)=>{ if(i===M.trail.length-1) return; const a=(i+1)/M.trail.length*.22; ctx.fillStyle=`rgba(255,255,255,${a})`; ctx.beginPath(); ctx.arc(X(x),Y(y)-z*ph,br*(.4+.5*i/M.trail.length),0,Math.PI*2); ctx.fill() });
  const z=(M.ball.z||0)*ph, bs=br*(1+(M.ball.z||0)*5);
  ctx.fillStyle='rgba(0,0,0,.32)'; ctx.beginPath(); ctx.ellipse(X(M.ball.x)+2,Y(M.ball.y)+2,br,br*.75,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.strokeStyle='#111'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(X(M.ball.x),Y(M.ball.y)-z,bs,0,Math.PI*2); ctx.fill(); ctx.stroke();
  // TOR-Einblendung mit weichem Ein- und Ausblenden
  const target=M.phase==='cele'?1:0; M.celeA=(M.celeA||0)+(target-(M.celeA||0))*.15;
  if(M.celeA>.01){
    const a=M.celeA, sc=.85+.15*a;
    ctx.save(); ctx.globalAlpha=a;
    ctx.fillStyle='rgba(5,8,15,.58)'; ctx.fillRect(0,H/2-H*.16,W,H*.32);
    ctx.translate(W/2,H/2); ctx.scale(sc,sc);
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--flood').trim()||'#f3c94b';
    ctx.font=`800 ${Math.round(H*.16)}px 'Saira Condensed','Arial Narrow',sans-serif`; ctx.fillText('TOR!',0,-H*.03);
    ctx.fillStyle='#fff'; ctx.font=`700 ${Math.round(H*.055)}px 'Barlow',system-ui,sans-serif`; ctx.fillText(M.celeText||'',0,H*.09);
    ctx.restore();
  }
}

/* ===================== START ===================== */
load(); render(); if(isMP()) mpConnect();
</script>
