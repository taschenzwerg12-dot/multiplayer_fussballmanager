<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Leons Fußballmanager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: Flutlicht-Stadion. Dunkle Tribüne als Grund, der Rasen ist die Bühne, Zahlen wie auf der Anzeigetafel. Bewusst nur ein (dunkles) Design. */
:root{
  --night:#0c1322; --stand:#121b2d; --panel:#172137; --panel2:#1d2943; --line:#2a3752;
  --chalk:#eef1f7; --muted:#95a2bc; --flood:#f3c94b; --flood-ink:#1a1405; --red:#e4483c;
  --win:#3fb874; --draw:#c9a64a; --loss:#dd5a52; --cl:#3d8bfd; --el:#f08a24; --ecl:#36b37e;
  --grass:#2e7a47; --grass2:#296f40;
  --display:'Saira Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--night);color:var(--chalk);font-family:var(--body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--flood);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.label{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.09em;font-size:12.5px;color:var(--muted)}

/* Kopfzeile */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--stand)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--stand);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.badge{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:#12306b;border:3px solid var(--red);font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.04em}
.club{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.1}
.sub{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:none;border:0;padding:8px 12px;border-radius:8px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.03em;color:var(--muted)}
.tab:hover{color:var(--chalk);background:var(--panel)}
.tab[aria-current="true"]{color:var(--flood-ink);background:var(--flood)}

main{padding-block:22px 48px}
.grid{display:grid;gap:18px;align-content:start}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
@media (max-width:860px){.g2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.tabs{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none;margin-inline:-4px}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.boxhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.boxhead h2{font-size:22px}

.btn{border:1px solid var(--line);background:var(--panel2);padding:10px 16px;border-radius:9px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.main{background:var(--flood);color:var(--flood-ink);border-color:var(--flood);font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.03em;padding:11px 20px}
.btn.main:hover{filter:brightness(1.07)}
.btn.small{padding:6px 11px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Nächstes Spiel */
.next{background:linear-gradient(180deg,var(--panel2),var(--panel));}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:14px 0 18px}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.crest{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;border:3px solid}
.tname{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1}
.vsmark{font-family:var(--display);font-weight:800;font-size:28px;color:var(--muted)}
.meter{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}

.pill{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:6px;font-family:var(--display);font-weight:800;font-size:15px;color:#0c1322}
.W{background:var(--win)}.D{background:var(--draw)}.L{background:var(--loss)}

table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.07em;font-size:12px;color:var(--muted);text-align:right;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;text-align:right;border-bottom:1px solid rgba(42,55,82,.55)}
th.l,td.l{text-align:left}
tr.me td{background:rgba(243,201,75,.1);font-weight:700}
.zone{border-left:4px solid transparent}
.z-cl{border-left-color:var(--cl)}.z-el{border-left-color:var(--el)}.z-ecl{border-left-color:var(--ecl)}.z-po{border-left-color:var(--draw)}.z-rel{border-left-color:var(--loss)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.scroll{overflow-x:auto}

.reslist{display:flex;flex-direction:column;gap:8px}
.res{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:15px}
.res .score{font-family:var(--display);font-weight:800;font-size:18px}
.muted{color:var(--muted)}
.road{display:flex;gap:8px;flex-wrap:wrap}
.road span{border:1px dashed var(--line);border-radius:20px;padding:5px 12px;font-size:13.5px;color:var(--muted)}

/* Kader */
.pitchwrap{position:relative;max-width:440px;margin:0 auto;aspect-ratio:68/88;border-radius:10px;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--grass) 0 8.33%,var(--grass2) 8.33% 16.66%);border:2px solid rgba(255,255,255,.35)}
.pitchwrap::before{content:"";position:absolute;left:22%;right:22%;top:0;height:14%;border:2px solid rgba(255,255,255,.35);border-top:0}
.pitchwrap::after{content:"";position:absolute;left:22%;right:22%;bottom:0;height:14%;border:2px solid rgba(255,255,255,.35);border-bottom:0}
.half{position:absolute;left:0;right:0;top:0;height:2px;background:rgba(255,255,255,.35)}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;width:74px}
.slot .dot{width:34px;height:34px;border-radius:50%;background:var(--kit1,#12306b);color:var(--kit3,#fff);border:2px solid var(--kit2,#e4483c);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px}
.slot .nm{font-size:12px;font-weight:700;line-height:1.1;text-shadow:0 1px 2px rgba(0,0,0,.8);white-space:nowrap;max-width:74px;overflow:hidden;text-overflow:ellipsis}
.slot .rt{font-size:11px;font-family:var(--display);font-weight:700;background:rgba(12,19,34,.75);padding:0 5px;border-radius:4px}
.slot .rt.bad{color:var(--loss)}
.slot.sel .dot{background:var(--flood);color:var(--flood-ink);border-color:#fff;box-shadow:0 0 0 4px rgba(243,201,75,.35)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel2);padding:6px 11px;border-radius:20px;font-family:var(--display);font-weight:700;font-size:15px}
.chip[aria-pressed="true"]{background:var(--flood);color:var(--flood-ink);border-color:var(--flood)}
.strength{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;color:var(--flood)}
.plist tr{cursor:pointer}
.plist tr:hover td{background:rgba(255,255,255,.04)}
.tag{font-size:11.5px;font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--line);color:var(--muted)}
.tag.xi{background:rgba(63,184,116,.2);color:var(--win)}
.posg{font-family:var(--display);font-weight:700}
.hint{font-size:13.5px;color:var(--muted);margin:10px 0 0}

/* Spielplan */
.fx{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(42,55,82,.55)}
.fx .h{text-align:right}.fx .sc{text-align:center;font-family:var(--display);font-weight:800;font-size:18px;background:var(--panel2);border-radius:6px;padding:2px 0}
.fx.me{color:var(--flood)}

/* Start */
.start{max-width:560px;margin:8vh auto 0;text-align:left}
.start h1{font-size:52px;line-height:1;font-weight:800}
.start h1 em{font-style:normal;color:var(--flood)}
.field{display:flex;flex-direction:column;gap:6px;margin:22px 0}
.field input{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px;font:inherit;color:var(--chalk);font-size:17px}

/* Spielansicht */
.ov{position:fixed;inset:0;z-index:20;background:rgba(6,10,18,.94);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ovin{max-width:1000px;margin:0 auto;padding-block:16px 30px}
.board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;background:#05080f;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.board .tn{font-family:var(--display);font-weight:800;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .tn.r{text-align:right}
.board .mid{text-align:center}
.board .sc{font-family:var(--display);font-weight:800;font-size:38px;line-height:1;color:var(--flood);letter-spacing:.04em}
.board .min{font-family:var(--display);font-weight:700;color:var(--muted);font-size:15px}
.cvwrap{margin-top:12px;border-radius:10px;overflow:hidden;background:#1f5a34}
canvas{display:block;width:100%}
.ctrl{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.ticker{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;max-height:190px;overflow-y:auto;font-size:14.5px}
.ticker p{margin:0 0 6px}
.ticker b{font-family:var(--display);color:var(--flood);margin-right:8px}
.others{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 18px;margin-top:12px;font-size:14px}
@media (max-width:520px){.board .tn{font-size:17px}.board .sc{font-size:30px}.start h1{font-size:40px}}

.plist tr.cur td{background:rgba(243,201,75,.16);font-weight:700}
.plist tr.cur td:first-child{box-shadow:inset 4px 0 0 var(--flood)}
.slot{touch-action:none;cursor:grab}
.plist tr{touch-action:pan-y}
.slot.drop .dot{background:var(--flood);color:var(--flood-ink);border-color:#fff;transform:scale(1.18)}
.slot .dot{transition:transform .12s}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
.ghost{position:fixed;z-index:40;pointer-events:none;transform:translate(-50%,-60%);display:flex;flex-direction:column;align-items:center;gap:2px}
.ghost .dot{width:40px;height:40px;border-radius:50%;background:var(--flood);color:var(--flood-ink);border:2px solid #fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.ghost .nm{font-size:12.5px;font-weight:700;background:rgba(12,19,34,.85);padding:1px 6px;border-radius:4px}

/* Wettbewerb */
.comp{display:inline-block;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:5px;background:var(--line);color:var(--chalk)}
.comp.cl{background:linear-gradient(90deg,#1b2f6e,#3c4fa8);color:#dfe6ff}
.comp.sm{font-size:11px;padding:1px 6px;margin-right:4px;vertical-align:1px}
.clnext{background:linear-gradient(160deg,#1a2550,var(--panel) 70%)}
.tie{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(42,55,82,.55);font-size:14.5px}
.tie .r{text-align:right}
.tie .legs{font-family:var(--display);font-weight:700;font-size:16px;background:var(--panel2);padding:1px 8px;border-radius:5px;white-space:nowrap}
.tie .win{font-weight:700;color:var(--chalk)}
.tie span:not(.win):not(.legs){color:var(--muted)}
.tie.me{background:rgba(243,201,75,.08)}

/* Kalender */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding:2px 0 4px}
.day{min-height:74px;background:var(--panel2);border:1px solid transparent;border-radius:7px;padding:5px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;min-width:0}
.day:hover{border-color:var(--muted)}
.day .dn{font-family:var(--display);font-weight:700;font-size:15px;line-height:1}
.day.past{opacity:.55}
.day.today{border-color:var(--flood);box-shadow:inset 0 0 0 1px var(--flood)}
.day.sel{background:rgba(243,201,75,.14);border-color:var(--flood);opacity:1}
.ev{display:block;max-width:100%;font-size:11.5px;font-weight:700;line-height:1.2;padding:2px 4px;border-radius:4px;background:var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.cl{background:linear-gradient(90deg,#1b2f6e,#3c4fa8);color:#dfe6ff}
.ev.ghost{opacity:.6}
.ev.done.W{box-shadow:inset 3px 0 0 var(--win)}.ev.done.D{box-shadow:inset 3px 0 0 var(--draw)}.ev.done.L{box-shadow:inset 3px 0 0 var(--loss)}
@media (max-width:520px){.day{min-height:54px;padding:3px}.ev{font-size:10px;padding:1px 2px}.day .dn{font-size:13px}}

/* Champions-League-Blau */
.clnext{background:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1.6px) 0 0/22px 22px,radial-gradient(120% 90% at 85% 0%,#2f5ae0 0%,transparent 55%),linear-gradient(155deg,#0a1a55 0%,#14318f 60%,#0d2470 100%);border-color:#4466e0;color:#fff}
.clnext .muted,.clnext .hint{color:#c3cff5}
.clnext .vsmark{color:#a9bbf5}
.clnext .bar{background:rgba(255,255,255,.18)}
.clnext .comp.cl{background:#fff;color:#0d2470}
.clnext .btn:not(.main){background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:#fff}
.clnext .label{color:#c3cff5}
.ov.clmode .board{background:linear-gradient(155deg,#0a1a55,#14318f);border-color:#4466e0}
.ov.clmode .board .min{color:#c3cff5}
.day.dl1{background:#3a4255}
.day.dcl{background:linear-gradient(160deg,#173aa8,#0d2470);border-color:#3456cf}
.day.dcl .ev,.day.dl1 .ev{background:rgba(255,255,255,.16);color:#fff}
.day.dcl .ev.ghost{background:rgba(255,255,255,.1)}
.day.past.dcl,.day.past.dl1{opacity:.6}
/* Neuigkeiten, Finanzen */
.msgs{display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.msg{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:baseline}
.finmini{display:flex;gap:28px;flex-wrap:wrap}
.big{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.1}
.frow{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;font-size:14.5px}
.fbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.fbar i{display:block;height:100%;border-radius:5px}
.fbar.pos i{background:var(--win)}.fbar.neg i{background:var(--loss)}
.frow2{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(42,55,82,.55);font-size:14.5px}
.subtabs{margin-bottom:16px}
.spongrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.spongrid{grid-template-columns:minmax(0,1fr)}}
.spon{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0;font-size:14px}
.spon.sel{border-color:var(--flood)}
.spon.empty{border-style:dashed;border-color:var(--loss)}
.sbrand{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.15}
.offer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(42,55,82,.55);font-size:14px}
.btn.main2{background:var(--flood);color:var(--flood-ink);border-color:var(--flood);font-weight:700}
.ghostbtn{background:none}
.btn.warn{border-color:var(--loss);color:var(--loss)}
/* Trikot */
.kitwrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:start}
.kitwrap.one{align-items:center}
@media (max-width:620px){.kitwrap{grid-template-columns:minmax(0,1fr)}.kitprev{justify-self:center}}
.kitprev{background:radial-gradient(circle at 50% 40%,#25324d,#141c2e);border-radius:12px;padding:10px;display:grid;place-items:center;max-width:100%}
.kitprev svg{max-width:100%;height:auto}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.25);padding:0}
.sw[aria-pressed="true"]{border-color:var(--flood);box-shadow:0 0 0 3px rgba(243,201,75,.35)}
.kitfoot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:18px}
.kitfoot > div:first-child{flex:1;min-width:200px}
.meter2{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px}
.meter2 i{display:block;height:100%;background:linear-gradient(90deg,var(--loss),var(--draw),var(--win));border-radius:5px}
/* Training & Talente */
.plansel{background:var(--panel2);color:var(--chalk);border:1px solid var(--line);border-radius:7px;padding:5px 6px;font:inherit;font-size:13.5px;max-width:190px}
.mbar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:3px}
.mbar i{display:block;height:100%;background:var(--win)}
.mbar.neg i{background:var(--loss)}
.mbar.pos{max-width:160px}.mbar.pos i{background:var(--cl)}
.acad{display:flex;flex-direction:column}
.acrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(42,55,82,.55);font-size:14.5px}
.acbtn{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.potbar.sm{height:8px;margin:6px 0 2px;max-width:240px}
.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.region{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.region:hover{border-color:var(--flood)}
.region .cost{font-family:var(--display);font-weight:700;color:var(--flood)}

/* Transfers */
.tgrid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:960px){.tgrid{grid-template-columns:minmax(0,1fr)}}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.search{background:var(--panel2);color:var(--chalk);border:1px solid var(--line);border-radius:7px;padding:7px 10px;font:inherit;font-size:14.5px;min-width:0;flex:1 1 140px}
.mlist td{vertical-align:middle}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid;margin-right:5px;vertical-align:-1px}
.winopen{border-color:var(--win)}
.winopen .comp{background:var(--win);color:#0c1322}
.pcsell{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.steps{display:flex;gap:6px;margin:16px 0 10px;flex-wrap:wrap}
.steps span{font-family:var(--display);font-weight:700;font-size:14px;padding:3px 10px;border-radius:20px;background:var(--line);color:var(--muted)}
.steps .cur{background:var(--flood);color:var(--flood-ink)}
.steps .done{background:rgba(63,184,116,.25);color:var(--win)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;padding:4px 2px;margin-bottom:12px}
.bub{max-width:86%;padding:8px 12px;border-radius:12px;font-size:14.5px;background:var(--panel2);align-self:flex-start;border-bottom-left-radius:4px}
.bub .who{display:block;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.bub.w-me{align-self:flex-end;background:rgba(243,201,75,.16);border-bottom-left-radius:12px;border-bottom-right-radius:4px}
.bub.w-agent{background:rgba(61,139,253,.16)}
.negrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.negrow .search{max-width:150px;font-size:18px;font-family:var(--display);font-weight:700}
.pats{display:inline-flex;gap:4px;vertical-align:-1px;margin-right:6px}
.pats i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.pats i.on{background:var(--win)}
.dealok{background:rgba(63,184,116,.14);border:1px solid var(--win);border-radius:10px;padding:12px 14px;font-size:15px}
.dealno{background:rgba(221,90,82,.12);border:1px solid var(--loss);border-radius:10px;padding:12px 14px;font-size:15px}

/* Modus-Menü */
.topin{position:relative}
.brand{padding-right:110px}
.modemenu{position:absolute;top:10px;right:max(16px,env(safe-area-inset-right,0px));z-index:8}
.modebtn{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.modebtn:hover{border-color:var(--muted)}
.modebtn.adm{border-color:var(--flood)}
.burger{display:flex;flex-direction:column;gap:4px}.burger i{display:block;width:18px;height:2px;border-radius:1px;background:var(--chalk)}
.admtag{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.08em;color:var(--flood-ink);background:var(--flood);padding:1px 7px;border-radius:5px}
.modepop{position:absolute;right:0;top:calc(100% + 6px);width:min(290px,calc(100vw - 32px));background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 14px 40px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:4px}
.modeopt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:none;border:1px solid transparent;border-radius:9px;padding:9px 10px}
.modeopt:hover{background:var(--panel)}
.modeopt[aria-checked="true"]{border-color:var(--flood);background:rgba(243,201,75,.1)}

/* ======================= TV-DESIGN ======================= */
:root{--night:#070a11;--stand:#0b0f19;--panel:#111725;--panel2:#18203a;--line:#232c44;--chalk:#f3f5fa;--muted:#8e9ab5;--club1:#12306b;--club2:#e4483c;--gemc:#5fd4f5}
body{background:radial-gradient(1100px 460px at 12% -160px,color-mix(in srgb,var(--club1) 42%,transparent),transparent 70%),radial-gradient(900px 400px at 100% -140px,color-mix(in srgb,var(--club2) 20%,transparent),transparent 70%),var(--night);background-attachment:fixed}
h1,h2,h3{text-transform:uppercase;letter-spacing:.015em;font-weight:800}
.label{letter-spacing:.12em}
body::before{background:#0b0f19}
.top{background:linear-gradient(100deg,color-mix(in srgb,var(--club1) 70%,#05070c) 0%,color-mix(in srgb,var(--club1) 25%,#0b0f19) 38%,#0b0f19 70%);border-bottom:3px solid var(--flood);box-shadow:0 6px 24px rgba(0,0,0,.35)}
.topin{padding-block:12px 10px}
.club{font-size:25px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.sub{color:color-mix(in srgb,var(--chalk) 70%,transparent)}
.hcrest{display:grid;place-items:center;filter:drop-shadow(0 4px 10px rgba(0,0,0,.55))}
.brand{padding-right:180px}
.tabs{gap:2px;margin-top:4px}
.tab{border-radius:0;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);padding:8px 18px;text-transform:uppercase;font-size:15px;letter-spacing:.06em;color:color-mix(in srgb,var(--chalk) 72%,transparent);background:rgba(255,255,255,.03)}
.tab:hover{background:rgba(255,255,255,.09);color:var(--chalk)}
.tab[aria-current="true"]{background:var(--flood);color:var(--flood-ink)}
.box{border-radius:3px;background:linear-gradient(180deg,var(--panel2) 0,var(--panel) 140px);border:1px solid var(--line);position:relative;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.box::before{content:"";position:absolute;left:-1px;top:-1px;width:64px;height:3px;background:var(--flood)}
.boxhead h2{font-size:20px}
.btn{border-radius:2px;text-transform:uppercase;letter-spacing:.04em;font-family:var(--display);font-weight:700;font-size:15px}
.btn.small{font-size:13.5px}
.btn.main,.btn.main2{clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);border-radius:0;padding-inline:24px;background:var(--flood);color:var(--flood-ink);border-color:var(--flood)}
.btn.main2{padding-inline:18px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{border-radius:2px;text-transform:uppercase;letter-spacing:.04em;font-size:14px}
.chip[aria-pressed="true"]{background:var(--flood);color:var(--flood-ink);border-color:var(--flood)}
th{font-size:11.5px;letter-spacing:.1em;border-bottom:2px solid var(--line)}
tbody tr:nth-child(even) td{background:rgba(255,255,255,.018)}
td.zone{font-family:var(--display);font-weight:800;font-size:15px}
tr.me td{background:color-mix(in srgb,var(--flood) 16%,transparent)!important}
.pill{border-radius:0;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%);min-width:30px}
.res .score{background:#05070c;border:1px solid var(--line);padding:1px 10px;border-radius:2px}
.comp{border-radius:0;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);padding:3px 12px}
.mc{display:inline-flex;vertical-align:-4px;margin-right:7px}
.crestsvg{display:block;flex:none}
.fx .mc{margin:0 4px}
.tag{border-radius:2px}
/* Spieltags-Grafik */
.matchup{position:relative;margin:14px -18px 18px;padding:18px 12px;background:linear-gradient(105deg,color-mix(in srgb,var(--hc) 78%,#000) 0 49.6%,color-mix(in srgb,var(--ac) 78%,#000) 50.4% 100%);overflow:hidden;isolation:isolate}
.matchup::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.55));z-index:-1}
.matchup::after{content:"";position:absolute;left:50%;top:-10%;bottom:-10%;width:4px;background:var(--flood);transform:skewX(-15deg);z-index:-1}
.matchup .tname{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.8);text-transform:uppercase;font-weight:800}
.matchup .vsmark{color:#fff;background:#05070c;padding:4px 12px;font-size:22px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.matchup .crestsvg{filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.clnext .matchup .vsmark{background:#0a1a55}
/* Kopf: Juwelen */
.modemenu{display:flex;gap:8px;align-items:center}
.gemchip{display:flex;align-items:center;gap:6px;background:rgba(5,7,12,.55);border:1px solid var(--line);border-radius:2px;padding:7px 11px;font-family:var(--display);font-size:17px}
.gemchip:hover{border-color:var(--gemc)}
.gem{display:block}
.modebtn{border-radius:2px;background:rgba(5,7,12,.55)}
.modepop{border-radius:4px}
/* Start & Vereinswahl */
.startwrap{max-width:1080px;margin:5vh auto 0}
.starthero h1{font-size:clamp(40px,7vw,68px);line-height:.95}
.starthero h1 em{font-style:normal;color:var(--flood)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:20px 0}
.pclub{display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 8px 12px;background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 22%,var(--panel)),var(--panel));border:1px solid var(--line);border-radius:3px;text-align:center;position:relative}
.pclub:hover{border-color:var(--pc2)}
.pclub.sel{border-color:var(--flood);box-shadow:0 0 0 2px var(--flood) inset}
.pname{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:16px;line-height:1.1}
.stars{color:var(--flood);letter-spacing:2px;font-size:13px}.stars i{font-style:normal;color:var(--line)}
.pfoot{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:16px;align-items:end;background:linear-gradient(100deg,color-mix(in srgb,var(--pc) 45%,var(--panel2)),var(--panel));border:1px solid var(--line);border-top:3px solid var(--flood);padding:16px;border-radius:3px}
.pfoot p{grid-column:1/-1}
@media (max-width:760px){.pfoot{grid-template-columns:minmax(0,1fr)}}
.pchosen{display:flex;gap:14px;align-items:center;min-width:0}
.pbig{font-family:var(--display);font-weight:800;font-size:28px;text-transform:uppercase;line-height:1}
.field input{border-radius:2px}
.ov2{position:fixed;inset:0;z-index:25;background:rgba(4,6,10,.88);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ovbox{max-width:1080px;margin:4vh auto;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--flood);padding-block:18px;border-radius:3px}
.ovbox.small{max-width:600px}
.slot2{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.slotempty{width:40px;height:40px;display:grid;place-items:center;border:1px dashed var(--line);font-family:var(--display);font-weight:800;color:var(--muted)}
/* Shop */
.shopgrid{grid-template-columns:minmax(0,.8fr) minmax(0,1.5fr)}
@media (max-width:900px){.shopgrid{grid-template-columns:minmax(0,1fr)}}
.gembig{display:flex;align-items:center;gap:14px;font-family:var(--display);font-weight:800;font-size:64px;line-height:1}
.packs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:620px){.packs{grid-template-columns:minmax(0,1fr)}}
.pack{position:relative;overflow:hidden;border-radius:4px;padding:20px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);background:linear-gradient(160deg,#1c2640,#0e1424 70%)}
.pack.pk-star{background:linear-gradient(160deg,#4a3a10,#1a1406 55%,#0e0b05);border-color:#8a6a1c}
.pack::after{content:"";position:absolute;inset:-40% -40% auto auto;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 65%)}
.packtop h2{font-size:26px}
.packart{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:44px}
.packart .gem{width:52px;height:52px}
.pk-star .packart{color:#f6d26b}
.odds{display:flex;flex-direction:column;gap:4px;font-size:14px;border-top:1px solid rgba(255,255,255,.12);padding-top:10px}
.odds div{display:flex;justify-content:space-between}
.pack .btn{align-self:flex-start;margin-top:auto}
.packov{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 45%,rgba(40,60,110,.55),rgba(3,5,9,.96) 60%);display:grid;place-items:center;padding:20px}
.packshake{width:200px;height:280px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(160deg,#1c2640,#0e1424);border:2px solid #3b4a75;animation:shake 1.5s ease-in both}
.packshake.pk-star{background:linear-gradient(160deg,#6a5214,#1a1406);border-color:#d6a93a}
.packshake .gem{width:80px;height:80px}
@keyframes shake{0%{transform:scale(.6) rotate(0);opacity:0}15%{transform:scale(1) rotate(0);opacity:1}30%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}50%{transform:rotate(-6deg)}60%{transform:rotate(6deg)}70%{transform:rotate(-8deg) scale(1.05)}80%{transform:rotate(8deg) scale(1.08)}90%{transform:scale(1.15);filter:brightness(1.6)}100%{transform:scale(1.3);opacity:0;filter:brightness(3)}}
@media (prefers-reduced-motion:reduce){.packshake{animation:none}}
.revealwrap{text-align:center;animation:pop .5s ease-out both}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.revealwrap{animation:none}}
.reveal{width:min(320px,100%);margin:0 auto;padding:22px 20px;border-radius:6px;background:linear-gradient(170deg,#24304f,#101626);border:2px solid #4a5b8c;display:flex;flex-direction:column;align-items:center;gap:8px}
.reveal.gold{background:linear-gradient(170deg,#7a5c14,#2a1f07);border-color:#f2c94c;box-shadow:0 0 60px rgba(242,201,76,.35)}
.reveal.niete{background:linear-gradient(170deg,#2a2f3a,#14171e);border-color:#4a5060}
.reveal h2{font-size:26px}
.rtop{display:flex;justify-content:space-between;width:100%}
.rr{font-family:var(--display);font-weight:800;font-size:54px;line-height:1}
.rpos{font-family:var(--display);font-weight:800;font-size:22px;align-self:flex-start;padding-top:6px}
.rbig{font-family:var(--display);font-weight:800;font-size:44px;color:var(--win)}
.rcrest{margin:-28px 0 4px}
@media (max-width:700px){.brand{padding-right:0;padding-top:46px}.modemenu{top:8px}.club{font-size:21px}}
.quickpick{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:color-mix(in srgb,var(--flood) 10%,var(--panel2));border:1px solid color-mix(in srgb,var(--flood) 40%,var(--line));padding:12px 14px;margin:0 0 12px;border-radius:3px}
.quickpick > div{flex:1 1 260px}

/* Verhandlung: Handgeld */
.negrow3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto auto;gap:8px;align-items:end;margin-top:6px}
.negrow3 label{display:flex;flex-direction:column;gap:4px;min-width:0}
.negrow3 .search{max-width:none;font-size:18px;font-family:var(--display);font-weight:700;flex:none;height:auto}
@media (max-width:560px){.negrow3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.negrow3 .btn{grid-column:1/-1}}
.bub.w-news{align-self:center;max-width:94%;background:rgba(221,90,82,.16);border:1px solid var(--loss);border-radius:4px;font-weight:600}
.bub.w-news .who{color:var(--loss)}
/* Here we go */
.hwg{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;overflow-y:auto}
.hwgbg{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--club1) 70%,#000) 0%,#04060b 70%);animation:hwgfade .5s ease-out both}
.hwgbg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 46px);animation:hwgslide 6s linear infinite}
.hwgin{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;max-width:560px;width:100%}
.hwgtitle{display:flex;gap:.25em;font-family:var(--display);font-weight:800;font-size:clamp(46px,11vw,96px);line-height:.9;letter-spacing:.01em;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.hwgtitle span{display:inline-block;animation:hwgword .5s cubic-bezier(.2,1.6,.4,1) both}
.hwgtitle span:nth-child(2){animation-delay:.18s}.hwgtitle span:nth-child(3){animation-delay:.36s;color:var(--flood)}
.hwgcard{width:100%;background:linear-gradient(160deg,color-mix(in srgb,var(--club1) 55%,#0b0f19),#0b0f19 75%);border:2px solid var(--flood);border-radius:6px;padding:26px 20px 20px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:hwgcard .6s .55s cubic-bezier(.2,1.3,.4,1) both}
.hwgcrest{position:absolute;top:-46px;left:50%;transform:translateX(-50%);filter:drop-shadow(0 8px 18px rgba(0,0,0,.6))}
.hwgnum{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;color:var(--flood);margin-top:40px}
.hwgname{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,40px);text-transform:uppercase;line-height:1.05}
.hwgmeta{color:var(--muted);margin-top:6px}.hwgmeta b{color:var(--chalk)}
.hwgfrom{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap;font-weight:600}
.hwgfrom .arrow{color:var(--flood);font-weight:800}
.hwgdeal{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.15)}
.hwgdeal div{display:flex;flex-direction:column;gap:2px}.hwgdeal b{font-family:var(--display);font-size:20px}
.hwgin .btn{animation:hwgfade .4s 1.1s both}
@keyframes hwgfade{from{opacity:0}to{opacity:1}}
@keyframes hwgslide{from{background-position:0 0}to{background-position:460px 0}}
@keyframes hwgword{from{transform:translateY(40px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes hwgcard{from{transform:translateY(40px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.hwg.still *, .hwg.still{animation:none!important}

/* Multiplayer */
.modeswitch{display:flex;gap:4px;margin:18px 0 4px}
.mpstart{display:flex;flex-direction:column;gap:16px;margin-top:16px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--flood);padding:18px;border-radius:3px}
.mpopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.mpopts{grid-template-columns:minmax(0,1fr)}}
.mpopt{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.mpopt h3{font-size:19px}
.lobby{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--flood);padding:18px;border-radius:3px}
.lobbycode{text-align:center}.lobbycode .code{font-family:var(--display);font-weight:800;font-size:64px;letter-spacing:.15em;color:var(--flood);line-height:1.1}
.lobbymem{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
@media (max-width:640px){.lobbymem{grid-template-columns:minmax(0,1fr)}}
.lm{display:flex;gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);padding:12px;border-radius:3px;min-width:0}
.lm.ok{border-color:var(--win)}
.pclub.taken{opacity:.35;cursor:not-allowed}
.mpstat{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:14px}
.mpstat span{padding:3px 10px;border:1px solid var(--line);border-radius:2px;color:var(--muted)}
.mpstat span.ok{border-color:var(--win);color:var(--win)}
.mptag{display:inline-block;background:var(--flood);color:var(--flood-ink);font-weight:700;padding:0 6px;border-radius:2px}
.waitdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--flood);animation:pulse 1s ease-in-out infinite alternate;margin-right:6px}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.waitdot{animation:none}}
tr.rival td{background:rgba(221,90,82,.14)!important}
/* Spielerkarte */
.pc-ov{display:grid;place-items:center}
.pc-ov .wrap{width:100%;max-width:520px;padding-block:20px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.pchead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.pcnum{width:56px;height:56px;border-radius:50%;background:#12306b;border:3px solid var(--red);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px}
.pcname{font-size:28px;line-height:1.05}
.pcstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
@media (max-width:440px){.pcstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pcv{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.05}
.small{font-size:12.5px}
.potbar{position:relative;height:14px;border-radius:7px;background:var(--line);margin-top:8px;overflow:hidden}
.potbar i{position:absolute;left:0;top:0;bottom:0;border-radius:7px}

  if(N.lastOffer && amount<N.lastOffer){ N.pat--; N.log.push({who:'club', t:'Jetzt bietet ihr weniger als vorher? So nicht.'}) }
  else if(amount>=N.ask) ok=true;
  else if(amount>=N.min){
    const close=(amount-N.min)/Math.max(.1,N.ask-N.min);
    if(Math.random()<.12+close*.5) ok=true;
    else { N.pat--; N.ask=round1(N.ask-(N.ask-amount)*.4); N.log.push({who:'club', t:pick([`Wir kommen euch ein Stück entgegen: ${fmtM(N.ask)}.`,`Knapp daneben. Für ${fmtM(N.ask)} machen wir es.`,`Legt noch etwas drauf. ${fmtM(N.ask)} ist unser Preis.`])}) }
  } else if(amount<N.min*.7){
    N.pat-=2; N.log.push({who:'club', t:pick(['Das ist eine Frechheit! So kann man nicht verhandeln.','Ist das ein Witz? Für so wenig verkaufen wir nicht mal einen Ersatzspieler.'])});
    if(N.top3) N.pat=0;
  } else { N.pat--; N.log.push({who:'club', t:`Das reicht nicht. Wir wollen weiterhin ${fmtM(N.ask)}.`}) }
  N.lastOffer=Math.max(N.lastOffer,amount);
  if(!ok && N.pat>0) rivalStep(N,p,'club');
  if(ok){
    N.fee=amount; N.stage='player';
    const interest = reputation() - T(p.club).str + rnd(-3,5) - (N.rival?3:0);
    const base=wageDemand(p)*(interest<0?1.3:1);
    N.wAsk=round1(base*rnd(1.08,1.22)); N.wMin=round1(base*rnd(.88,.98));
    // Handgeld: einmalige Zahlung an den Spieler bei der Unterschrift
    N.hAsk=round1(base*(p.r>=85?rnd(1,2):p.r>=78?rnd(.4,1):rnd(0,.4))); N.hMin=round1(N.hAsk*rnd(.5,.75));
    N.years = ageOf(p)<=24?5:ageOf(p)<=29?4:2;
    N.wpat = p.r>=86 ? 2 : 3;
    N.log.push({who:'club', t:`Einverstanden! ${club} akzeptiert ${fmtM(amount)}. Jetzt müsst ihr euch mit dem Spieler einigen.`});
    N.log.push({who:'agent', t:`Hallo, ich bin der Berater von ${p.full}. ${interest<0?`Er spielt sehr gern bei ${club}. Damit er wechselt, muss es sich richtig lohnen. `:`Er kann sich einen Wechsel zu ${CN()} gut vorstellen. `}Wir möchten ${fmtM(N.wAsk)} pro Jahr${N.hAsk>0?`, ${fmtM(N.hAsk)} Handgeld bei der Unterschrift`:''} und einen Vertrag über ${N.years} Jahre.`});
  } else if(N.pat<=0){ N.stage='failed'; S.blocked[id]=S.season; N.log.push({who:'club', t:'Wir brechen die Gespräche ab. Diese Saison verhandeln wir nicht mehr mit euch über ihn.'}) }
}
const ROLES = {star:['Star der Mannschaft',.9],stamm:['Stammspieler',1],rot:['Rotationsspieler',1.2]};
function offerPlayer(id, wage, years, role, hand){
  const N=S.negs[id], p=marketPlayer(id), rf=ROLES[role][1];
  wage=round1(wage); hand=round1(Math.max(0,hand||0));
  N.log.push({who:'me', t:`Angebot: ${fmtM(wage)} pro Jahr, ${fmtM(hand)} Handgeld, ${years} ${years===1?'Jahr':'Jahre'}, Rolle: ${ROLES[role][0]}.`});
  let ask=N.wAsk*rf, min=N.wMin*rf;
  if(Math.abs(years-N.years)>=2) { ask*=1.08; min*=1.08 }
  // Handgeld zählt mit: fehlendes Handgeld muss über das Gehalt ausgeglichen werden und umgekehrt
  const y=Math.max(2,years), eff=wage+(hand-N.hAsk)/y, effMin=wage+(hand-N.hMin)/y;
  let ok=false;
  if(role==='rot' && p.r>=85){ N.wpat--; N.log.push({who:'agent', t:`Ein Spieler wie ${p.name} wechselt nicht, um auf der Bank zu sitzen.`}) }
  else if(N.hMin>1 && hand<N.hMin*.4){ N.wpat--; N.log.push({who:'agent', t:`Ohne ordentliches Handgeld unterschreibt er nicht. Wir reden von mindestens ${fmtM(N.hMin)}.`}) }
  else if(eff>=ask) ok=true;
  else if(effMin>=min){ const close=(eff-min)/Math.max(.1,ask-min); if(Math.random()<.2+close*.5) ok=true; else { N.wpat--; N.wAsk=round1(N.wAsk-(N.wAsk-wage/rf)*.4); N.log.push({who:'agent', t:`Wir sind fast da. Mit ${fmtM(round1(N.wAsk*rf))} pro Jahr${N.hAsk>0?` und ${fmtM(N.hAsk)} Handgeld`:''} unterschreibt er.`}) } }
  else if(eff<min*.8){ N.wpat-=2; N.log.push({who:'agent', t:'Mit so einem Angebot brauchen wir gar nicht weiterzureden.'}) }
  else { N.wpat--; N.log.push({who:'agent', t:`Das ist zu wenig. Er möchte ${fmtM(round1(N.wAsk*rf))} pro Jahr${N.hAsk>0?` und ${fmtM(N.hAsk)} Handgeld`:''}.`}) }
  if(!ok && N.wpat>0) rivalStep(N,p,'player');
  if(ok){
    if(hand>S.fin.bal-N.fee && !S.admin){ N.log.push({who:'news', t:`Achtung: Ablöse plus Handgeld (${fmtM(N.fee+hand)}) sind mehr, als auf deinem Konto ist. Der Deal kommt trotzdem, aber dein Konto rutscht ins Minus.`}) }
    N.stage='done'; N.wage=wage; N.hand=hand; N.years=years; N.role=role;
    const when=nextWindowOpen(S.today);
    S.pending.push({type:'in', id, fee:N.fee, wage, hand, years, date:when, club:p.club, name:p.full});
    p.sold=true;
    if(isMP() && when>S.today) mpClaim(id, N.fee+wage*years+hand);
    N.log.push({who:'agent', t:`Deal! ${p.name} freut sich auf ${CN()}.`});
    msg(`Einigung mit ${p.full} (${T(p.club).name}) für ${fmtM(N.fee)}.${when>S.today?` Der Wechsel passiert, wenn das Transferfenster am ${fmtShort(when)} öffnet.`:''}`);
    executePending();
  } else if(N.wpat<=0){ N.stage='failed'; S.blocked[id]=S.season; N.log.push({who:'agent', t:N.rival?`Wir haben uns für ${T(N.rival).name} entschieden. Danke für die Gespräche.`:'Wir haben uns entschieden: Er bleibt, wo er ist. Danke für die Gespräche.'}) }
}

/* ---------- Wechsel vollziehen (nur im Transferfenster) ---------- */
function execIn(x){
  const m=marketPlayer(x.id); if(!m) return;
  const nums=new Set(S.players.map(p=>p.n));
  const pl={id:m.id, n:nums.has(m.n)?freeNumber():m.n, name:m.name, full:m.full, pos:m.pos, alt:m.alt, born:m.born, r:m.r, pot:m.pot, sal:x.wage, r0:m.r, prog:0, signed:S.season};
  pl.years=x.years; S.players.push(pl); S.market=S.market.filter(p=>p.id!==x.id);
  money('transferOut', -x.fee); if(x.hand) money('handgeld', -x.hand);
  (S.hwg=S.hwg||[]).push({id:pl.id, from:x.club, fee:x.fee, wage:x.wage, hand:x.hand||0, years:x.years});
  msg(`Willkommen bei ${CN()}, ${pl.full}! Er trägt die Nummer ${pl.n}.`);
}
function executePending(){
  if(!inWindow(S.today)) return;
  const keep=[];
  (S.pending||[]).forEach(x=>{
    if(x.date>S.today){ keep.push(x); return }
    if(x.type==='in' && isMP()){ mpExecIn(x); return }
    if(x.type==='in'){ execIn(x); return }
    if(false){
      const m=null;
      const nums=new Set(S.players.map(p=>p.n));
      const pl={id:m.id, n:nums.has(m.n)?freeNumber():m.n, name:m.name, full:m.full, pos:m.pos, alt:m.alt, born:m.born, r:m.r, pot:m.pot, sal:x.wage, r0:m.r, prog:0, signed:S.season};
      pl.years=x.years; S.players.push(pl); S.market=S.market.filter(p=>p.id!==x.id);
      money('transferOut', -x.fee); if(x.hand) money('handgeld', -x.hand);
      (S.hwg=S.hwg||[]).push({id:pl.id, from:x.club, fee:x.fee, wage:x.wage, hand:x.hand||0, years:x.years});
      msg(`Willkommen bei ${CN()}, ${pl.full}! Er trägt die Nummer ${pl.n}.`);
    } else {
      const p=P(x.id); if(!p) return;
      S.players=S.players.filter(q=>q.id!==x.id); delete S.train.plans[x.id];
      money('transferIn', x.fee);
      S.market.push({id:p.id, club:x.club, full:p.full, name:p.name, pos:p.pos, alt:p.alt, born:p.born, r:p.r, pot:p.pot, n:p.n});
      msg(`${p.full} hat ${CN()} verlassen und spielt jetzt für ${T(x.club).name}. Einnahme: ${fmtM(x.fee)}.`);
      patchLineup();
    }
  });
  S.pending=keep;
}
function patchLineup(){
  const slots=FORMATIONS[S.lineup.formation], xi=S.lineup.xi, used=new Set();
  xi.forEach((id,i)=>{ if(!P(id)||used.has(id)) xi[i]=null; else used.add(id) });
  xi.forEach((id,i)=>{ if(id) return; let best=null,bv=-1; S.players.forEach(p=>{ if(used.has(p.id)) return; const v=eff(p,slots[i][0]); if(v>bv){bv=v;best=p} }); if(best){ xi[i]=best.id; used.add(best.id) } });
}

/* ---------- Verkaufen: Angebote anderer Vereine ---------- */
function genOffers(days){
  S.offers=(S.offers||[]).filter(o=>o.exp>=S.today);
  S.players.forEach(p=>{
    if(p.leaving || S.offers.some(o=>o.pid===p.id)) return;
    const per = p.listed ? .07 : (p.r>=84 ? .0025 : 0); if(!per) return;
    if(Math.random() > 1-Math.pow(1-per,days)) return;
    const clubs=TRANSFER_CLUBS().filter(c=>c.str>=p.r-(p.listed?12:5)); if(!clubs.length) return;
    const c=pick(clubs), v=marketValue(p);
    const amount=round1(v*(p.listed?rnd(.75,1.05):rnd(1.05,1.35))), max=round1(amount*rnd(1.05,1.3));
    S.offers.push({oid:'o'+Math.random().toString(36).slice(2,9), pid:p.id, club:c.id, amount, max, exp:addDays(S.today,21), unasked:!p.listed});
    msg(`${c.name} bietet ${fmtM(amount)} für ${p.full}${p.listed?'':' (ungefragt!)'}. Antworte unter Transfers.`);
  });
}
function acceptSale(oid){
  const o=S.offers.find(x=>x.oid===oid); if(!o) return; const p=P(o.pid);
  p.leaving=true; p.listed=false;
  const when=nextWindowOpen(S.today);
  S.pending.push({type:'out', id:p.id, fee:o.amount, club:o.club, date:when, name:p.full});
  S.offers=S.offers.filter(x=>x.pid!==o.pid);
  msg(`Verkauf vereinbart: ${p.full} geht für ${fmtM(o.amount)} zu ${T(o.club).name}.${when>S.today?` Wechsel am ${fmtShort(when)}.`:''}`);
  executePending();
}
function counterSale(oid){
  const o=S.offers.find(x=>x.oid===oid); if(!o) return 'gone';
  const ask=round1(o.amount*1.15);
  if(ask<=o.max){ o.amount=ask; o.countered=true; return 'ok' }
  S.offers=S.offers.filter(x=>x.oid!==oid); msg(`${T(o.club).name} war das zu teuer und zieht das Angebot zurück.`); return 'gone';
}
function genMarketTalents(n){
  for(let i=0;i<n;i++){ const reg=pick(REGIONS), t=makeTalent(reg,17,20); t.club=pick(TRANSFER_CLUBS()).id; t.n=30+Math.floor(Math.random()*20); t.r=Math.round(rnd(66,76)); t.pot=Math.max(t.pot,t.r+6); delete t.sal; delete t.youth; t.gen=true; S.market.push(t) }
}
function marketFrom(world){
  const own=new Set(S.players.map(p=>p.id));
  let m=buildMarket().filter(p=>!['om','asm','ol'].includes(p.club));
  Object.entries(world).forEach(([club,ps])=>{ if(club!==ME) m=m.concat(ps.map(p=>({...p}))) });
  if(ME!=='psg') m=m.concat(PLAYERS.map(p=>({...p, club:'psg', alt:p.alt})));
  return m.filter(p=>!own.has(p.id));
}
function initMarket(world){ S.market=marketFrom(world||genL1World()); S.negs={}; S.blocked={}; S.offers=[]; S.pending=[]; genMarketTalents(10); S.marketV2=true }
function ageMarket(){
  S.market.forEach(p=>{ const a=ageOf(p); let ch=Math.round(annualGrowth(a)*rnd(.5,1.4)); if(ch>0) ch=Math.min(ch,Math.max(0,p.pot-p.r)); p.r=Math.max(50,p.r+ch); if(p.r>p.pot) p.pot=p.r; p.sold=false });
  S.market=S.market.filter(p=>!(ageOf(p)>=36||(ageOf(p)>=34&&Math.random()<.4)));
  S.negs={}; S.blocked={};
  genMarketTalents(8);
}

async function mpJoin(code,name){
  code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,''); if(code.length!==5){ mpErr='Der Code hat 5 Zeichen.'; render(); return }
  mpBusy='Lobby wird gesucht...'; mpErr=''; render();

const PACKS = {
  classic:{name:'Klassik-Pack', cost:3, chance:.75, min:80, max:85, niete:2, desc:'Ein solider Profi mit 80 bis 85 Stärke, so wie Jonathan Tah oder Kai Havertz.'},
  star:{name:'Star-Pack', cost:7, chance:.7, min:90, max:99, niete:10, desc:'Hohe Chance auf einen Weltstar mit 90 oder mehr Stärke.'}

function openPack(k){
  const pk=PACKS[k];
  if((S.gems||0)<pk.cost) return null;
  S.gems-=pk.cost;
  const busy=new Set((S.pending||[]).map(x=>x.id));
  let pool=S.market.filter(p=>!p.sold&&!busy.has(p.id)&&p.r>=pk.min&&p.r<=pk.max);
  if(k==='star'&&!pool.length) pool=S.market.filter(p=>!p.sold&&!busy.has(p.id)).sort((a,b)=>b.r-a.r).slice(0,5);
  if(Math.random()<pk.chance && pool.length){
    const m=pick(pool);
    if(S.players.length+incomingCount()>=SQUAD_MAX){ const v=marketValue(m); money('pack',v); msg(`Pack: ${m.full}! Dein Kader ist voll, deshalb wurde er sofort für ${fmtM(v)} verkauft.`); return {type:'full',p:m,v} }
    const nums=new Set(S.players.map(p=>p.n));
    const pl={id:m.id, n:nums.has(m.n)?freeNumber():m.n, name:m.name, full:m.full, pos:m.pos, alt:m.alt, born:m.born, r:m.r, pot:m.pot, sal:wageDemand(m), r0:m.r, prog:0, signed:S.season, fromPack:true, fromClub:m.club};
    S.players.push(pl); S.market=S.market.filter(p=>p.id!==m.id); delete S.negs[m.id];
    if(isMP()) mpMarkSold(m.id);
    msg(`Pack-Glück: ${m.full} (${m.r}) kommt von ${T(m.club).name} zu ${CN()}!`);
    return {type:'player',p:pl,club:m.club};
  }
  money('pack',pk.niete); msg(`${pk.name}: leider eine Niete. Du bekommst ${fmtM(pk.niete)}.`);
  return {type:'niete',v:pk.niete};
}

const INTENSITY = {easy:{name:'Locker',dev:.7,str:.6,desc:'Die Spieler sind frisch (+0,6 Teamstärke), entwickeln sich aber langsamer.'},
  norm:{name:'Normal',dev:1,str:0,desc:'Ausgewogen: normale Entwicklung, normale Frische.'},
  hard:{name:'Hart',dev:1.35,str:-.8,desc:'Die Spieler werden schneller besser, sind aber müde (−0,8 Teamstärke).'}};
const MAX_PLANS = 30;
// Bester Trainingsschwerpunkt für einen Spieler (null = keiner bringt etwas)
function bestPlan(p){ const a=ageOf(p); if(a<=23 && p.pot-p.r>=1) return 'dev'; if(a>=29) return 'fit'; return null }
function autoPlans(){
  let n=0;
  S.players.forEach(p=>{ const cur=S.train.plans[p.id]; if(cur&&cur.t==='pos') return;   // Positionen lernen bleibt erhalten
    const b=bestPlan(p); if(b){ S.train.plans[p.id]={t:b}; n++ } else delete S.train.plans[p.id] });
  return n;
}
function annualGrowth(a){ return a<=18?7:a<=20?6:a<=22?4:a<=24?2.5:a<=27?1:a<=29?0:a<=31?-1.5:a<=33?-3:-4.5 }
function develop(days){
  const I=INTENSITY[S.train.int], inXI=new Set(S.lineup.xi), y=days/365;
  const one=(p,acad)=>{
    const a=ageOf(p), plan=S.train.plans[p.id];
    let rate=annualGrowth(a)*rnd(.6,1.4);
    if(rate>0){
      rate*=I.dev*(acad?.85:inXI.has(p.id)?1.25:.85);
      if(plan&&plan.t==='dev'&&a<=23) rate*=1.5;
      rate*=Math.min(1,Math.max(0,(p.pot-p.r))/4);
    } else if(rate<0){
      if(plan&&plan.t==='fit') rate*=.5;
      if(S.train.int==='hard') rate*=1.1;
    }
    p.prog=(p.prog||0)+rate*y;
    while(p.prog>=1 && p.r<p.pot){ p.r++; p.prog-=1 }
    if(p.r>=p.pot && p.prog>0) p.prog=0;
    while(p.prog<=-1){ p.r=Math.max(40,p.r-1); p.prog+=1 }
    if(plan&&plan.t==='pos'){
      plan.prog=(plan.prog||0)+y*4*I.dev*rnd(.8,1.2);
      if(plan.prog>=1){ p.alt=[...(p.alt||[]),plan.pos]; delete S.train.plans[p.id]; msg(`${p.full} kann jetzt auch ${POS_NAME[plan.pos]} spielen.`) }
    }
  };
  S.players.forEach(p=>one(p,false));
  (S.academy||[]).forEach(p=>one(p,true));
}

const KIT_COLORS = [['#12306b','Marineblau','blue'],['#1f4fd1','Royalblau','blue'],['#8fc8ef','Himmelblau','sky'],['#e4483c','Rot','red'],['#9b1b30','Bordeaux','red'],

const KIT_PATTERNS = {uni:['Einfarbig',4],hechter:['Mittelstreifen',12],streifen:['Streifen',6],nadel:['Nadelstreifen',5],ringel:['Ringel',3],schaerpe:['Schärpe',7],halb:['Zweigeteilt',4]};
function kitColors(){ const t=T(ME), own=[[t.c1,'Vereinsfarbe 1','club'],[t.c2,'Vereinsfarbe 2','club'],[t.tc,'Vereinsfarbe 3','club']].filter((c,i,a)=>a.findIndex(x=>x[0].toLowerCase()===c[0].toLowerCase())===i);
  return own.concat(KIT_COLORS.filter(k=>!own.some(o=>o[0].toLowerCase()===k[0].toLowerCase()))) }
const colTag = c => (KIT_COLORS.find(k=>k[0]===c)||[])[2];
function kitScore(k){
  let v=45;
  const t=T(ME), near=(a,b)=>{ const x=rgbOf(a), y=rgbOf(b); return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])<70 };
  const club=[t.c1,t.c2,t.tc], cols=[k.c1,k.c2,k.c3];
  if(club.slice(0,2).some(c=>near(k.c1,c))) v+=14;                       // Grundfarbe in Vereinsfarbe
  if(cols.slice(1).some(a=>club.some(c=>near(a,c)))) v+=8;               // Vereinsfarbe im Muster
  if(!cols.some(a=>club.some(c=>near(a,c)))) v-=8;                       // gar keine Vereinsfarbe
  if(colTag(k.c3)==='white') v+=3; if(cols.some(a=>colTag(a)==='gold')) v+=4;
  v+= k.pattern==='hechter' ? (ME==='psg'?12:6) : KIT_PATTERNS[k.pattern][1];
  if(k.c1===k.c2 && k.pattern!=='uni') v-=8;
  const cur=S.kit; if(cur.c1===k.c1&&cur.c2===k.c2&&cur.c3===k.c3&&cur.pattern===k.pattern) v-=12;
  return Math.max(15,Math.min(92,v));
}

function prepare(){

    if(!S.players) S.players=PLAYERS.map(p=>({...p}));

      const old=S.market.filter(p=>keep.has(p.id)), fresh=marketFrom(genL1World()).filter(p=>!keep.has(p.id));

function migrateCal(){
  // Alter Spielstand ohne Champions League: Kalender nachbauen, verpasste CL-Spiele nachsimulieren
  S.cal=buildCal(); S.psgLog=[]; S.done=false; clInit(CL_START);

/* ===================== SPIEL-SIMULATION ===================== */
function simMatch(h,a,neutral){
  const sh=strengthOf(h)+rnd(-2.5,2.5), sa=strengthOf(a)+rnd(-2.5,2.5);
  let xh=1.4*Math.exp((sh-sa)/25)*(neutral?1:1.08), xa=1.4*Math.exp((sa-sh)/25)*(neutral?1:.92);
  const th=tacOf(h), ta=tacOf(a);
  if(th){ const k=TACTICS[th]; xh*=k.my; xa*=k.opp }
  if(ta){ const k=TACTICS[ta]; xa*=k.my; xh*=k.opp }
  const res={h,a,hg:poisson(Math.min(xh,4.5)),ag:poisson(Math.min(xa,4.5))};
  if(isHuman(h)||isHuman(a)) res.events=makeEvents(res);
  return res;
}
// Gegner-Elf aus den echten Kadern (Transfermarkt-Daten), sonst null
function oppXI(club){
  if(isMP() && club===S.mp.other && mpTeams[club] && mpTeams[club].xi) return mpTeams[club].xi;
  const pool=S.market.filter(p=>p.club===club&&!p.sold);
  if(pool.length<11) return null;
  const slots=FORMATIONS['4-4-2'], pairs=[];
  slots.forEach((sl,i)=>pool.forEach(p=>pairs.push({i,p,v:eff(p,sl[0])+(p.pos===sl[0]?.5:0)})));
  pairs.sort((a,b)=>b.v-a.v);
  const xi=new Array(11).fill(null), used=new Set();
  for(const q of pairs){ if(!xi[q.i]&&!used.has(q.p.id)){ xi[q.i]=q.p; used.add(q.p.id) } }
  return xi.every(Boolean)?xi:null;
}
const GOAL_W={TW:0,IV:.3,LV:.5,RV:.5,ZDM:.5,ZM:1.3,OM:2.6,LF:3.4,RF:3.4,ST:5};
const AST_W={TW:.05,IV:.25,LV:1,RV:1,ZDM:.7,ZM:1.6,OM:3,LF:2.6,RF:2.6,ST:1.4};
function makeEvents(res){
  const n=res.hg+res.ag, mins=[];
  let tries=0;
  while(mins.length<n && tries<500){ tries++; const m=Math.floor(rnd(3,90)); if(mins.every(x=>Math.abs(x-m)>=4)) mins.push(m) }
  while(mins.length<n) mins.push(89);
  mins.sort((a,b)=>a-b);
  const sides=shuffle([...Array(res.hg).fill('h'),...Array(res.ag).fill('a')]);
  const slots=FORMATIONS[S.lineup.formation];
  const xiOf={}; [res.h,res.a].forEach(t=>{ if(t!==ME) xiOf[t]=oppXI(t) });
  return mins.map((min,i)=>{
    const side=sides[i], team=side==='h'?res.h:res.a;
    const ev={min, side, scorer:null};
    if(team===ME){
      // Je besser der Spieler, desto öfter trifft er (Stärke hoch 6)
      ev.scorer=wpick(S.lineup.xi, S.lineup.xi.map((id,k)=>GOAL_W[slots[k][0]]*Math.pow(P(id).r/80,5)));
      const rest=S.lineup.xi.filter(id=>id!==ev.scorer);
      if(Math.random()<.8) ev.assist=wpick(rest, rest.map(id=>AST_W[slots[S.lineup.xi.indexOf(id)][0]]*Math.pow(P(id).r/80,5)));
    } else if(xiOf[team]){
      const xi=xiOf[team], roles=(isMP()&&team===S.mp.other&&mpTeams[team]?FORMATIONS[mpTeams[team].formation]:FORMATIONS['4-4-2']).map(x=>x[0]);
      const k=wpick([...xi.keys()], xi.map((p,j)=>GOAL_W[roles[j]]*Math.pow(p.r/80,5)));
      ev.os=xi[k].id; ev.osName=xi[k].full;
      const rest=[...xi.keys()].filter(j=>j!==k);
      if(Math.random()<.8){ const a=wpick(rest, rest.map(j=>AST_W[roles[j]]*Math.pow(xi[j].r/80,5))); ev.oa=xi[a].id; ev.oaName=xi[a].full }
    }
    return ev;
  });
}
const scorerName = ev => ev.scorer ? P(ev.scorer)?.full : ev.osName;
const assistName = ev => ev.assist ? P(ev.assist)?.full : ev.oaName;
function addToTable(tab,rs){

function stepMatches(st){

function clInit(teams){

  ids.forEach(id=>tab[id]={p:0,w:0,d:0,l:0,gf:0,ga:0});
  S.cl={teams:ids, lp:makeSchedule(ids).slice(0,8), table:tab, po:[], r16:[], qf:[], sf:[], fin:null, champion:null, psgOut:ids.includes(ME)?null:'Nicht qualifiziert', psgIn:ids.includes(ME)};
}
function clStandings(){
  const t=S.cl.table;
  return S.cl.teams.map(id=>({id,...t[id],pts:t[id].w*3+t[id].d,gd:t[id].gf-t[id].ga}))
    .sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||T(a.id).name.localeCompare(T(b.id).name));
}
const mkTie = (a,b) => ({a,b,l1:null,l2:null,w:null,pens:false});
function decideTie(t,ga,gb){
  if(ga!==gb){ t.w=ga>gb?t.a:t.b; return }
  t.pens=true;
  // Im Multiplayer muss das Elfmeterschießen auf beiden Geräten gleich ausgehen
  const sa=isMP()?T(t.a).str:strengthOf(t.a), sb=isMP()?T(t.b).str:strengthOf(t.b), pa=.5+(sa-sb)/120;
  const rr=isMP()?seededRand(S.mp.code+S.season+t.a+t.b+ga+gb):Math.random(); t.w=rr<pa?t.a:t.b;
}
function clApply(c,rs){
  const C=S.cl;
  if(c[0]==='L'){
    addToTable(C.table,rs);
    if(c==='L8'){
      const st=clStandings(); C.top8=st.slice(0,8).map(x=>x.id);
      C.po=[...Array(8)].map((_,i)=>mkTie(st[23-i].id, st[8+i].id));
      const pp=st.findIndex(x=>x.id===ME)+1; if(pp>24) C.psgOut='Aus in der Ligaphase';
    }
    return;
  }
  if(c==='F'){
    const r=rs[0], f=C.fin; f.l1=r; decideTie(f,r.hg,r.ag); C.champion=f.w;
    if(f.a===ME||f.b===ME){ if(f.w!==ME) C.psgOut='Finale verloren' }
    return;
  }
  const ties=clTies(c), leg2=/(2|b)$/.test(c);
  ties.forEach((t,i)=>{ if(!leg2) t.l1=rs[i]; else { t.l2=rs[i]; decideTie(t, t.l1.hg+t.l2.ag, t.l1.ag+t.l2.hg) } });
  if(!leg2) return;
  const stage=c.replace(/[0-9ab]$/,'');
  const lost=ties.find(t=>(t.a===ME||t.b===ME)&&t.w!==ME);
  if(lost) C.psgOut=`Aus ${{PO:'in den Play-offs',R16:'im Achtelfinale',QF:'im Viertelfinale',SF:'im Halbfinale'}[stage]}`;
  const W=ties.map(t=>t.w);
  if(stage==='PO') C.r16=C.top8.map((seed,k)=>mkTie(W[7-k],seed));
  if(stage==='R16') C.qf=[0,1,2,3].map(j=>mkTie(W[2*j],W[2*j+1]));
  if(stage==='QF') C.sf=[0,1].map(j=>mkTie(W[2*j],W[2*j+1]));
  if(stage==='SF') C.fin=mkTie(W[0],W[1]);
}
function clNote(c){
  const C=S.cl;
  if(c==='F'){ const f=C.fin; return f.pens?`Im Elfmeterschießen: ${T(f.w).name} gewinnt`:'' }
  if(c[0]!=='L' && /(2|b)$/.test(c)){ const t=clTies(c).find(t=>t.a===ME||t.b===ME); if(!t) return '';
    const ga=t.l1.hg+t.l2.ag, gb=t.l1.ag+t.l2.hg;

}

const rgbOf = h => { const c=h.replace('#',''); return [0,2,4].map(i=>parseInt(c.substr(i,2),16)) };
const toHex = a => '#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
function lum(h){ return rgbOf(h).map(v=>v/255).map(x=>x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4)).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0) }
const mixC = (a,b,t) => { const x=rgbOf(a), y=rgbOf(b); return toHex(x.map((v,i)=>v+(y[i]-v)*t)) };
const isGrey = h => { const a=rgbOf(h); return Math.max(...a)-Math.min(...a)<22 };
const inkOn = h => lum(h)>.36 ? '#0b0f18' : '#ffffff';
function accentFor(t){
  let a=[t.c1,t.c2,t.tc].find(c=>{ const l=lum(c); return l>.035 && l<.8 && !isGrey(c) }) || '#f3c94b';
  let guard=0; while(lum(a)<.13 && guard++<8) a=mixC(a,'#ffffff',.16);
  return a;
}
function applyTheme(){
  const t=T(ME), a=accentFor(t), r=document.documentElement.style;
  r.setProperty('--flood',a); r.setProperty('--flood-ink',inkOn(a));
  r.setProperty('--club1', isGrey(t.c1)&&lum(t.c1)>.5 ? t.c2 : t.c1); r.setProperty('--club2', t.c2);
}

const CREST_PATS = ['solid','vstripes','halves','hoops','diag','chevron','quarters','cross','center'];
const CREST_FIX = {psg:['heater','center'],om:['octa','hoops'],asm:['kite','diag'],ol:['pointed','halves'],losc:['badge','chevron'],rcl:['heater','hoops'],srfc:['hex','halves'],ogcn:['badge','vstripes'],rcsa:['octa','chevron'],
  fcb:['badge','halves'],bvb:['heater','diag'],rma:['kite','chevron'],bar:['badge','quarters'],atm:['hex','cross'],int:['hex','vstripes'],mci:['octa','solid'],che:['kite','diag'],liv:['pointed','solid'],ars:['badge','center']};
function crestSpec(id){
  if(CREST_FIX[id]) return CREST_FIX[id];
  let h=0; for(const ch of id) h=(h*31+ch.charCodeAt(0))>>>0;
  const shapes=Object.keys(CREST_SHAPES);
  return [shapes[h%shapes.length], CREST_PATS[(h>>4)%CREST_PATS.length]];
}
let crestSeq=0;
function crestInner(id, withText){
  const t=T(id)||{c1:'#444',c2:'#888',tc:'#fff',short:'?'}, [shape,pat]=crestSpec(id), d=CREST_SHAPES[shape], cid='cr'+(++crestSeq);
  const c1=t.c1, c2=(t.c2.toLowerCase()===t.c1.toLowerCase())?t.tc:t.c2;
  const P={solid:'',
    vstripes:[10,34,58,82].map(x=>`<rect x="${x}" y="0" width="12" height="100" fill="${c2}"/>`).join(''),
    halves:`<rect x="50" y="0" width="50" height="100" fill="${c2}"/>`,
    hoops:[8,40,72].map(y=>`<rect x="0" y="${y}" width="100" height="14" fill="${c2}"/>`).join(''),
    diag:`<polygon points="0,18 18,0 100,82 82,100" fill="${c2}"/>`,
    chevron:`<polygon points="0,62 50,84 100,62 100,78 50,100 0,78" fill="${c2}"/><polygon points="0,6 50,28 100,6 100,18 50,40 0,18" fill="${c2}" opacity=".9"/>`,
    quarters:`<rect x="50" y="0" width="50" height="50" fill="${c2}"/><rect x="0" y="50" width="50" height="50" fill="${c2}"/>`,
    cross:`<rect x="42" y="0" width="16" height="100" fill="${c2}"/><rect x="0" y="66" width="100" height="12" fill="${c2}"/>`,
    center:`<rect x="36" y="0" width="28" height="100" fill="${c2}"/><rect x="33" y="0" width="3" height="100" fill="${t.tc}"/><rect x="64" y="0" width="3" height="100" fill="${t.tc}"/>`}[pat];
  const band = lum(c1)>.5 ? (lum(c2)<.5?c2:'#10151f') : '#0b0f18';
  const txt = esc(t.short), fs = txt.length<=3?20:txt.length===4?17:14;
  return `<defs><clipPath id="${cid}"><path d="${d}"/></clipPath></defs>

}

function openPackAnim(k){
  const res=openPack(k); if(!res){ toast('Nicht genug Juwelen.'); return }
  save(); render();
  const ov=document.createElement('div'); ov.className='packov'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-label','Pack wird geöffnet');

  ov.innerHTML=`<div class="packshake pk-${k}"><div class="packart">${GEM}</div><div class="label">${PACKS[k].name}</div></div>`;
  document.body.appendChild(ov);
  setTimeout(()=>{
    let inner;
    if(res.type==='niete') inner=`<div class="reveal niete"><div class="label">Leider</div><h2>Niete</h2><div class="rbig">${fmtM(res.v)}</div><p class="muted">Das Geld ist schon auf deinem Konto.</p></div>`;
    else { const p=res.p, c=res.club||p.club; inner=`<div class="reveal ${p.r>=90?'gold':''}"><div class="rtop"><span class="rr num">${p.r}</span><span class="rpos">${p.pos}</span></div>
      <div class="rcrest">${crestSVG(c,56)}</div><h2>${esc(p.full)}</h2><div class="muted">${POS_NAME[p.pos]} · ${ageOf(p)} Jahre · Potenzial ${p.pot}</div>
      <p>${res.type==='full'?`Dein Kader ist voll. Er wurde für <b>${fmtM(res.v)}</b> verkauft.`:`Kommt von ${esc(T(c).name)} zu ${esc(CN())}!`}</p></div>` }
    ov.innerHTML=`<div class="revealwrap">${inner}<div class="row" style="justify-content:center;margin-top:16px">
      ${(S.gems||0)>=PACKS[k].cost?`<button class="btn" data-again="${k}">Noch eins öffnen</button>`:''}<button class="btn main" data-done>Weiter</button></div></div>`;
    ov.querySelector('[data-done]').focus();
  }, reduce?200:1600);
  ov.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;

}

      <span class="num legs">${final?leg(t.l1):`${leg(t.l1)} · ${t.l2?`${t.l2.ag}:${t.l2.hg}`:'–:–'}`}${t.pens?' <span class="muted">i.E.</span>':''}</span>

  const games=S.psgLog.filter(r=>r.comp==='CL');
  return `<div class="grid g2">

    ${stage('Finale',C.fin,true)}${stage('Halbfinale',C.sf)}${stage('Viertelfinale',C.qf)}${stage('Achtelfinale',C.r16)}${stage('Play-offs',C.po)}

     <tbody>${st.map((x,i)=>`<tr class="${x.id===ME?'me':isMP()&&x.id===S.mp.other?'rival':''}"><td class="l zone ${i<8?'z-ecl':i<24?'z-cl':'z-rel'}">${i+1}</td><td class="l">${mc(x.id)}${esc(T(x.id).name)}</td><td>${x.p}</td><td>${x.gd>0?'+':''}${x.gd}</td><td><b>${x.pts}</b></td></tr>`).join('')}</tbody></table></div>

function stepPsgResult(st,idx){
  if(idx>=S.step) return null;
  if(st.t==='lig') return (S.results[st.md]||[]).find(r=>r.h===ME||r.a===ME)||null;
  const lab=stepLabel(st).replace(/^Champions League · /,'');
  return S.psgLog.find(r=>r.comp==='CL'&&r.label===lab)||null;
}
function dayEvents(){
  const map={};
  S.cal.forEach((st,idx)=>{ const d=dateOfStep(st); (map[d]=map[d]||[]).push({st,idx}) });
  return map;
}
function calView(){
  const first=seasonStart().slice(0,7), months=[];
  for(let i=0;i<11;i++){ const x=new Date(ms(first+'-01')); x.setUTCMonth(x.getUTCMonth()+i); months.push(iso(x.getTime()).slice(0,7)) }
  if(!calMonth||!months.includes(calMonth)) calMonth = months.includes(S.today.slice(0,7)) ? S.today.slice(0,7) : months[0];
  const mi=months.indexOf(calMonth), ev=dayEvents();
  const m0=calMonth+'-01', start=new Date(ms(m0)), lead=(start.getUTCDay()+6)%7;
  const daysIn=new Date(Date.UTC(start.getUTCFullYear(),start.getUTCMonth()+1,0)).getUTCDate();
  const cells=[]; for(let i=0;i<lead;i++) cells.push(null); for(let d=1;d<=daysIn;d++) cells.push(addDays(m0,d-1)); while(cells.length%7) cells.push(null);
  const chip=(e)=>{
    const {st,idx}=e, isCL=st.t==='cl', m=stepMatches(st).find(x=>x.includes(ME));
    const res=stepPsgResult(st,idx);
    if(res){ const o=outcome(res), op=T(res.h===ME?res.a:res.h); return `<span class="ev ${isCL?'cl':''} done ${o}">${res.hg}:${res.ag} ${esc(op.short)}</span>` }
    if(m){ const op=T(m[0]===ME?m[1]:m[0]); return `<span class="ev ${isCL?'cl':''}">${m[0]===ME?'':'@ '}${esc(op.short)}</span>` }
    if(isCL) return `<span class="ev cl ghost">CL</span>`;
    return '';
  };
  const sel=calSel&&calSel.slice(0,7)===calMonth?calSel:null;
  let panel='';
  if(calSel){
    const evs=(ev[calSel]||[]);
    const lines=evs.map(e=>{ const m=stepMatches(e.st).find(x=>x.includes(ME)); const res=stepPsgResult(e.st,e.idx);
      const lab=stepLabel(e.st);
      if(res) return `<div class="res"><span class="pill ${outcome(res)}">${OUT_TXT[outcome(res)]}</span><span>${esc(T(res.h).name)} – ${esc(T(res.a).name)} <span class="muted">· ${esc(lab)}</span></span><span class="score num">${res.hg}:${res.ag}</span></div>`;
      if(m) return `<div class="res"><span class="pill" style="background:var(--line);color:var(--chalk)">•</span><span>${esc(T(m[0]).name)} – ${esc(T(m[1]).name)} <span class="muted">· ${esc(lab)}</span></span><span class="score num">–:–</span></div>`;
      return `<div class="muted">${esc(lab)}${S.cl.psgIn&&!S.cl.psgOut?' (Gegner steht noch nicht fest)':''}</div>`; }).join('');
    const toSim=S.step<S.cal.length && calSel>S.today && dateOfStep(curStep())<calSel;
    const nPsg=toSim?S.cal.slice(S.step).filter(st=>dateOfStep(st)<calSel && (st.t==='lig'||psgPlays(st)||!S.cl.psgOut)).length:0;
    const isNext=S.step<S.cal.length && dateOfStep(curStep())===calSel && psgPlays(curStep());
    panel=`<section class="box">
      <div class="boxhead"><h2>${fmtLong(calSel)}</h2>${calSel===S.today?'<span class="comp">Heute</span>':''}</div>
      ${lines?`<div class="reslist">${lines}</div>`:'<p class="muted" style="margin:0">Kein Spiel an diesem Tag.</p>'}
      <div class="row" style="margin-top:14px">
        ${toSim?`<button class="btn main" data-act="simto">Bis hierhin simulieren</button><span class="muted small">Bis zu ${nPsg} Spiele von ${esc(CS())} werden simuliert. Spiele an diesem Tag bleiben offen.</span>`:''}
        ${isNext?`<button class="btn main" data-act="watch">Spiel ansehen (2D)</button><button class="btn" data-act="sim">Simulieren</button>`:''}
        ${!toSim&&!isNext&&calSel<S.today?'<span class="muted small">Dieser Tag liegt in der Vergangenheit.</span>':''}
      </div></section>`;
  }
  return `<div class="grid g2">
   <section class="box">
     <div class="boxhead"><h2>${MON[+calMonth.slice(5,7)-1]} ${calMonth.slice(0,4)}</h2>
       <div class="row"><button class="btn small" data-mon="-1" ${mi===0?'disabled':''} aria-label="Vorheriger Monat">‹</button><button class="btn small" data-mon="0">Heute</button><button class="btn small" data-mon="1" ${mi===months.length-1?'disabled':''} aria-label="Nächster Monat">›</button></div></div>
     <div class="cal">${WD.map(w=>`<div class="wd">${w}</div>`).join('')}
       ${cells.map(d=>{ if(!d) return '<div></div>'; const evs=ev[d]||[];
         const fill=evs.some(e=>e.st.t==='cl')?'dcl':evs.some(e=>e.st.t==='lig')?'dl1':'';
         return `<button class="day ${fill} ${d<S.today?'past':''} ${d===S.today?'today':''} ${d===sel?'sel':''}" data-day="${d}" aria-label="${fmtLong(d)}"><span class="dn">${+d.slice(8)}</span>${evs.map(chip).join('')}</button>` }).join('')}
     </div>
     <div class="legend"><span style="--c:#4a5368">Ligue 1</span><span style="--c:#2448c4">Champions League</span><span style="--c:var(--flood)">Heute</span></div>

let drag=null, justDragged=false;
app.addEventListener('pointerdown',e=>{
  if(e.button>0) return;
  const slot=e.target.closest('.slot'), row=e.target.closest('tr[data-player]');
  if(!slot&&!row) return;
  const pid = slot ? S.lineup.xi[Number(slot.dataset.slot)] : row.dataset.player;
  drag={pid, fromSlot: slot?Number(slot.dataset.slot):null, x:e.clientX, y:e.clientY, on:false, ghost:null, over:null, id:e.pointerId};
});
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id) return;
  if(!drag.on){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<7) return;
    drag.on=true; const p=P(drag.pid);
    const g=document.createElement('div'); g.className='ghost'; g.innerHTML=`<span class="dot">${p.n}</span><span class="nm">${esc(p.name)}</span>`;
    document.body.appendChild(g); drag.ghost=g; document.body.classList.add('dragging');
  }
  e.preventDefault();
  drag.ghost.style.left=e.clientX+'px'; drag.ghost.style.top=e.clientY+'px';
  const el=document.elementFromPoint(e.clientX,e.clientY), t=el&&el.closest('.slot');
  if(drag.over&&drag.over!==t) drag.over.classList.remove('drop');
  if(t){ t.classList.add('drop'); drag.over=t } else drag.over=null;
},{passive:false});
function endDrag(e,cancel){
  if(!drag||(e&&e.pointerId!==drag.id)) return;
  const d=drag; drag=null;
  if(!d.on) return;
  d.ghost.remove(); document.body.classList.remove('dragging'); justDragged=true; setTimeout(()=>justDragged=false,350);
  if(cancel||!d.over) { render(); return }
  const to=Number(d.over.dataset.slot), xi=S.lineup.xi, cur=xi.indexOf(d.pid);
  if(cur>=0){ [xi[cur],xi[to]]=[xi[to],xi[cur]] } else xi[to]=d.pid;
  selSlot=null; save(); render();
}
window.addEventListener('pointerup',e=>endDrag(e,false));
window.addEventListener('pointercancel',e=>endDrag(e,true));

function teamDots(side,id){
  const human=isMP()&&id===S.mp.other&&mpTeams[id]&&mpTeams[id].xi;
  const isP=id===ME, slots=isP?FORMATIONS[S.lineup.formation]:human?FORMATIONS[mpTeams[id].formation]:FORMATIONS['4-4-2'];
  const xi=isP?null:oppXI(id), base=strengthOf(id);
  return slots.map((sl,i)=>{ let x=sl[1],y=sl[2]; if(side==='a'){x=1-x;y=1-y}
    const pl=isP?P(S.lineup.xi[i]):xi?xi[i]:null;
    return {side,team:id,role:sl[0],bx:x,by:y,x,y,tx:x,ty:y,vx:0,vy:0,
      num:pl?pl.n:OPP_NUM[i], pid:pl?pl.id:null, name:pl?pl.name:null, full:pl?pl.full:null,
      r: pl ? (isP?eff(pl,sl[0]):pl.r) : Math.round(base+rnd(-3,3))} });
}
const dirOf = side => side==='h'?1:-1;
function kickoff(side, hard){
  // hard = Anpfiff/Halbzeit: Spieler stehen sofort auf ihren Positionen. Nach einem Tor laufen sie selbst zurück.
  M.dots.forEach(d=>{ const kx=d.side==='h'?Math.min(d.bx*.6,.46):Math.max(1-(1-d.bx)*.6,.54); if(hard){ d.x=kx; d.y=d.by; d.vx=0; d.vy=0 } });
  const mine=M.dots.filter(d=>d.side===side&&d.role!=='TW').sort((a,b)=>Math.hypot(a.x-.5,a.y-.5)-Math.hypot(b.x-.5,b.y-.5))[0];
  if(hard){ mine.x=side==='h'?.485:.515; mine.y=.5 }
  M.holder=mine; M.poss=side; M.ball={x:.5,y:.5,z:0,fl:null}; M.timer=hard?.9:1.3; M.phase='play'; M.kick=mine;
}
function tick(text,min){ const t=M.ov.querySelector('#mtick'); const p=document.createElement('p'); p.innerHTML=`<b>${min}'</b>${esc(text)}`; t.prepend(p) }
function teamName(side){ return T(side==='h'?M.fx.h:M.fx.a).name }
